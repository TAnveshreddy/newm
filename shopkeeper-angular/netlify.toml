# Netlify config for the Angular app (used when deploying via Git).
# Base = this folder, so Netlify runs the build here and publishes the output.
[build]
  base = "shopkeeper-angular"
  command = "npm run build"
  publish = "dist/shopkeeper-angular/browser"

# SPA fallback: serve index.html for client-side routes (also covered by
# public/_redirects, which ends up in the publish folder).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
