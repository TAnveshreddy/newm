name: Deploy

# Deploys backend (App Service) and frontend (Static Web Apps) to an
# environment after CI passes (Phase 14 / §23). Promotion DEV -> TEST -> PROD is
# driven by GitHub Environments with required reviewers (approval gates).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: dev
        type: choice
        options: [dev, test, prod]

permissions:
  contents: read
  id-token: write # OIDC login to Azure — no stored cloud credentials

jobs:
  deploy-backend:
    name: Deploy backend
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: powerbi-ai-chatbot/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: powerbi-ai-chatbot/backend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm ci --omit=dev
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.BACKEND_APP_NAME }}
          package: powerbi-ai-chatbot/backend

  deploy-frontend:
    name: Deploy frontend
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    needs: deploy-backend
    steps:
      - uses: actions/checkout@v4
      - name: Build And Deploy (Static Web Apps)
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DEPLOYMENT_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: powerbi-ai-chatbot/frontend
          output_location: dist
        env:
          # Non-secret build-time config injected from GitHub environment vars.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_ENTRA_TENANT_ID: ${{ vars.VITE_ENTRA_TENANT_ID }}
          VITE_ENTRA_CLIENT_ID: ${{ vars.VITE_ENTRA_CLIENT_ID }}
          VITE_ENTRA_API_SCOPE: ${{ vars.VITE_ENTRA_API_SCOPE }}
          VITE_MOCK_AUTH: 'false'
