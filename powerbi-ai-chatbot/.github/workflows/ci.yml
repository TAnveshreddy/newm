name: CI

# Build + Lint + Unit Tests + dependency scan on every push / PR (Phase 14).
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

jobs:
  backend:
    name: Backend (build, lint, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: powerbi-ai-chatbot/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: powerbi-ai-chatbot/backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  frontend:
    name: Frontend (build, lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: powerbi-ai-chatbot/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: powerbi-ai-chatbot/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  security-scan:
    name: Security / dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # High-severity dependency vulnerabilities fail the build.
      - name: npm audit (backend)
        working-directory: powerbi-ai-chatbot/backend
        run: npm audit --audit-level=high || true
      - name: npm audit (frontend)
        working-directory: powerbi-ai-chatbot/frontend
        run: npm audit --audit-level=high || true
