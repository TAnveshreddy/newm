      { key: 'openingType', label: 'Balance Type', match: ['balancetype', 'openingtype', 'drcr', 'direction'] }
    ],
    sample: [['Party Name', 'Phone', 'Email', 'GSTIN', 'Type', 'Address', 'Opening Balance', 'Balance Type'],
      ['Rahul Enterprises', '9812345670', '', '29AAAPL1234C1ZV', 'customer', 'Jayanagar, Bengaluru', '5000', 'receive'],
      ['Mahalaxmi Wholesalers', '9765432109', '', '27AABCM9999Q1Z2', 'supplier', 'Mumbai', '12000', 'pay']]
  }
};

function normHeader(hd) {
  return String(hd || '').toLowerCase().replace(/[^a-z0-9]/g, '');
}

function mapHeaders(def, headerRow) {
  const map = {}; // colIndex -> key
  headerRow.forEach((hd, i) => {
    const n = normHeader(hd);
    if (!n) return;
    for (const col of def.columns) {
      if (col.match.includes(n) && !Object.values(map).includes(col.key)) { map[i] = col.key; break; }
    }
  });
  return map;
}

/* ---------- import UI ---------- */
let _importCtx = null;

function openImportModal(kind) {
  const def = IMPORT_DEFS[kind];
  _importCtx = { kind: kind, rows: null, map: null };
  openModal(
    '<div class="modal-head"><h3>' + def.title + ' from Excel / CSV</h3><button class="x" onclick="closeModal()">×</button></div>' +
    '<div class="modal-body">' +
    '<p class="sub">Upload an Excel file (<strong>.xlsx</strong>) or CSV with a header row. Columns are matched by name — download the template to see the expected format. From Excel you can also use <em>File → Save As → CSV</em>.</p>' +
    '<div class="head-actions" style="margin:12px 0">' +
    '<button class="btn ghost" onclick="downloadImportTemplate(\'' + kind + '\')">⬇ Download Template</button>' +
    '<button class="btn primary" onclick="el(\'imp_file\').click()">Choose File…</button>' +
    '<input type="file" id="imp_file" accept=".xlsx,.csv,text/csv" style="display:none" onchange="handleImportFile(this)">' +
    '</div>' +
    '<div id="imp_preview"></div>' +
    '</div>' +
    '<div class="modal-foot">' +
    '<label class="switch-row" style="margin-right:auto"><input type="checkbox" id="imp_update"> Update existing (matched by name)</label>' +
    '<button class="btn ghost" onclick="closeModal()">Cancel</button>' +
    '<button class="btn primary" id="imp_go" disabled onclick="runImport()">Import</button></div>',
    true
  );
}

function downloadImportTemplate(kind) {
  const def = IMPORT_DEFS[kind];
  downloadFile(def.template, toCSV(def.sample), 'text/csv;charset=utf-8');
  toast('Template downloaded — fill it in Excel and upload it back (as .xlsx or .csv)');
}

async function handleImportFile(input) {
  const f = input.files && input.files[0];
  if (!f) return;
  const def = IMPORT_DEFS[_importCtx.kind];
  try {
    let rows;
    if (/\.xlsx$/i.test(f.name)) {
      rows = await readXlsxRows(await f.arrayBuffer());
    } else {
      rows = parseCSV(await f.text());
    }
    if (!rows || rows.length < 2) throw new Error('File needs a header row plus at least one data row');
    const map = mapHeaders(def, rows[0]);
    const nameCol = Object.keys(map).find(i => map[i] === 'name');
    if (nameCol === undefined) throw new Error('Could not find a "' + def.columns[0].label + '" column in the header row');
    _importCtx.rows = rows;
    _importCtx.map = map;
    renderImportPreview();
  } catch (e) {
    el('imp_preview').innerHTML = '<p class="empty" style="color:var(--bad)">⚠ ' + esc(e.message) + '</p>';
    el('imp_go').disabled = true;
  }
  input.value = '';
}

function renderImportPreview() {
  const def = IMPORT_DEFS[_importCtx.kind];
  const { rows, map } = _importCtx;
  const cols = Object.keys(map).map(Number);
  const data = rows.slice(1);
  const valid = data.filter(r => String(r[cols.find(c => map[c] === 'name')] || '').trim() !== '');

  let html = '<p><strong>' + valid.length + '</strong> of ' + data.length + ' rows ready to import. Matched columns: ' +
    cols.map(c => '<span class="tag">' + esc(rows[0][c]) + ' → ' + def.columns.find(x => x.key === map[c]).label + '</span>').join(' ') + '</p>';
  html += '<div class="table-wrap" style="max-height:260px;overflow-y:auto"><table><thead><tr>' +
    cols.map(c => '<th>' + esc(def.columns.find(x => x.key === map[c]).label) + '</th>').join('') + '</tr></thead><tbody>' +
    valid.slice(0, 8).map(r => '<tr>' + cols.map(c => '<td>' + esc(r[c] == null ? '' : r[c]) + '</td>').join('') + '</tr>').join('') +
    '</tbody></table></div>';
  if (valid.length > 8) html += '<p class="sub">…and ' + (valid.length - 8) + ' more rows.</p>';
  el('imp_preview').innerHTML = html;
  el('imp_go').disabled = valid.length === 0;
}

function runImport() {
  const kind = _importCtx.kind;
  const def = IMPORT_DEFS[kind];
  const { rows, map } = _importCtx;
  const cols = Object.keys(map).map(Number);
  const updateExisting = el('imp_update').checked;
  let added = 0, updated = 0, skipped = 0;

  for (const r of rows.slice(1)) {
    const rec = {};
    for (const c of cols) {
      const colDef = def.columns.find(x => x.key === map[c]);
      let v = r[c] == null ? '' : String(r[c]).trim();
      rec[colDef.key] = colDef.num ? num(v) : v;
    }
    if (!rec.name) { skipped++; continue; }

    if (kind === 'items') {
      rec.type = /^s/i.test(rec.type || '') ? 'service' : 'product';
      rec.unit = (rec.unit || 'PCS').toUpperCase();
      rec.taxRate = GST_RATES.includes(num(rec.taxRate)) ? num(rec.taxRate) : num(rec.taxRate) || 0;
      const existing = state.items.find(i => i.name.toLowerCase() === rec.name.toLowerCase());
      if (existing) {
        if (updateExisting) { Object.assign(existing, rec); updated++; } else skipped++;
      } else {
        state.items.push(Object.assign({ id: uid(), createdAt: Date.now(), category: '', brand: '', hsn: '', description: '', salePrice: 0, purchasePrice: 0, taxRate: 0, openingStock: 0, minStock: 0 }, rec));
        added++;
      }
    } else {
      const t = (rec.type || '').toLowerCase();
      rec.type = t.startsWith('s') ? 'supplier' : t.startsWith('b') ? 'both' : 'customer';
      const ot = (rec.openingType || '').toLowerCase();
      rec.openingType = (ot.startsWith('p') || ot.startsWith('cr') || ot === 'topay') ? 'pay' : 'receive';
      rec.gstin = (rec.gstin || '').toUpperCase();
      const existing = state.parties.find(p => p.name.toLowerCase() === rec.name.toLowerCase());
      if (existing) {
        if (updateExisting) { Object.assign(existing, rec); updated++; } else skipped++;
      } else {
        state.parties.push(Object.assign({ id: uid(), createdAt: Date.now(), phone: '', email: '', gstin: '', address: '', openingBalance: 0, openingType: 'receive' }, rec));
        added++;
      }
    }
  }
  save();
  closeModal();
  toast('Imported: ' + added + ' added' + (updated ? ', ' + updated + ' updated' : '') + (skipped ? ', ' + skipped + ' skipped' : ''));
  route();
}

function billCustomerPicked() {

function billMobilePicked() {

/* ---------- add-item row ---------- */
function renderItemSelect() {

function billItemSelected(itemId) {

  bill.desc = it ? (it.description || '') : '';

function billAddSelected() {
  const it = getItem(bill.itemSel);
  if (!it) { toast('Select an item first', 'error'); return; }

  const desc = (bill.desc || '').trim();

    brand: brand, description: desc,
    rate: num(it.salePrice), disc: 0,
    taxRate: state.settings.taxEnabled ? num(it.taxRate) : 0,
    cost: num(it.purchasePrice)
  });

/* ---------- quick-add chips ---------- */
function renderProductPicker() {
  const box = el('bl_products');
  if (!box) return;
  const q = (bill.search || '').toLowerCase();
  const matches = state.items
    .filter(i => (!bill.category || i.category === bill.category) &&

  }).join('') : '<p class="empty">No matching products. <a class="crumb" onclick="openItemForm()">Add a product</a></p>';

function billAddItem(itemId) {
  const it = getItem(itemId);
  if (!it) return;
  const existing = bill.lines.find(l => l.itemId === itemId);
  if (existing) existing.qty = num(existing.qty) + 1;
  else bill.lines.push({
    itemId: it.id, name: it.name, hsn: it.hsn, unit: it.unit, qty: 1,
    brand: it.brand || '', description: it.description || '',
    rate: num(it.salePrice), disc: 0,
    taxRate: state.settings.taxEnabled ? num(it.taxRate) : 0,
    cost: num(it.purchasePrice)
  });

/* ---------- bill lines ---------- */
function renderBillLines() {
  const tb = el('bl_lines');
  if (!tb) return;
  tb.innerHTML = bill.lines.length ? bill.lines.map((l, i) => {
    const taxable = num(l.qty) * num(l.rate);
    const tot = taxable + (state.settings.taxEnabled ? taxable * num(l.taxRate) / 100 : 0);
    return '<tr>' +
      '<td><strong>' + esc(l.name) + '</strong><div class="sub">' + [l.brand, l.unit].filter(Boolean).map(esc).join(' · ') + '</div>' +
      '<input class="line-desc" placeholder="Product description (prints on invoice)" value="' + esc(l.description || '') + '" oninput="bill.lines[' + i + '].description=this.value"></td>' +
      '<td><div class="qty-ctl"><button class="btn tiny ghost" onclick="billQty(' + i + ',-1)">−</button>' +
      '<input class="r" type="number" step="any" min="0" onfocus="this.select()" value="' + num(l.qty) + '" oninput="billLineSet(' + i + ',\'qty\',this.value)">' +
      '<button class="btn tiny ghost" onclick="billQty(' + i + ',1)">+</button></div></td>' +
      '<td><input class="r" type="number" step="0.01" min="0" onfocus="this.select()" value="' + num(l.rate) + '" oninput="billLineSet(' + i + ',\'rate\',this.value)"></td>' +
      '<td><select onchange="billLineSet(' + i + ',\'taxRate\',this.value)">' + GST_RATES.map(r => '<option value="' + r + '"' + (num(l.taxRate) === r ? ' selected' : '') + '>' + r + '%</option>').join('') + '</select></td>' +
      '<td class="r amt">' + fmtMoney(tot) + '</td>' +
      '<td><button class="btn tiny danger-ghost" onclick="bill.lines.splice(' + i + ',1);renderBillLines()">×</button></td></tr>';
  }).join('') : '<tr><td colspan="6" class="empty">Select an item above (or click a product) to add it to the bill.</td></tr>';
  renderBillTotals();
}

function billQty(i, d) {
  bill.lines[i].qty = Math.max(0, num(bill.lines[i].qty) + d);
  if (bill.lines[i].qty === 0) bill.lines.splice(i, 1);
  renderBillLines();
}

function billLineSet(i, field, value) {
  bill.lines[i][field] = num(value);
  const row = el('bl_lines').rows[i];
  if (row) {
    const l = bill.lines[i];
    const taxable = num(l.qty) * num(l.rate);
    row.querySelector('.amt').textContent = fmtMoney(taxable + (state.settings.taxEnabled ? taxable * num(l.taxRate) / 100 : 0));
  }
  billTotalsRecalc();
}

/* whole-bill discount: convert a ₹ amount into the equivalent % of subtotal */
function billDiscountPct() {
  const sub = bill.lines.reduce((s, l) => s + num(l.qty) * num(l.rate), 0);
  if (bill.discountType === 'amt') {
    return sub > 0 ? Math.min(100, num(bill.discountVal) / sub * 100) : 0;
  }
  return Math.min(100, num(bill.discountVal));
}

/* The totals panel is built once; keystrokes in its inputs only update the
   displayed numbers (billTotalsRecalc). Rebuilding the panel on every input
   event would destroy the input mid-typing and steal focus — the page then
   feels frozen after the first keystroke. */
function renderBillTotals() {
  const box = el('bl_totals');
  if (!box) return;
  box.innerHTML =
    '<div class="totals-row"><span>Subtotal</span><span id="bl_sub"></span></div>' +
    '<div class="totals-row"><span>Discount on entire bill ' +
    '<input id="bl_discin" type="number" min="0" step="0.01" style="width:80px" onfocus="this.select()" value="' + num(bill.discountVal) + '" oninput="bill.discountVal=num(this.value);billTotalsRecalc()"> ' +
    '<select id="bl_disctype" style="width:56px" onchange="bill.discountType=this.value;billTotalsRecalc()">' +
    '<option value="pct"' + (bill.discountType === 'pct' ? ' selected' : '') + '>%</option>' +
    '<option value="amt"' + (bill.discountType === 'amt' ? ' selected' : '') + '>₹</option></select>' +
    '</span><span id="bl_discamt"></span></div>' +
    (state.settings.taxEnabled ? '<div class="totals-row"><span>GST</span><span id="bl_gst"></span></div>' : '') +
    '<div class="totals-row grand"><span>Total</span><span id="bl_grand"></span></div>' +
    '<div class="totals-row"><span>Received <button class="btn tiny ghost" onclick="billPaidFull()">Full</button></span>' +
    '<span><input id="bl_paid" type="number" min="0" step="0.01" style="width:110px;text-align:right" onfocus="this.select()" value="' + num(bill.paid) + '" oninput="bill.paid=num(this.value);billTotalsRecalc()"></span></div>' +
    '<div class="totals-row due"><span>Balance Due</span><span id="bl_due"></span></div>';
  billTotalsRecalc();
}

function billTotalsRecalc() {
  const t = computeTotals(JSON.parse(JSON.stringify(bill.lines)), billDiscountPct(), state.settings.taxEnabled);
  bill._totals = t;
  el('bl_sub').textContent = fmtMoney(t.subtotal);
  el('bl_discamt').textContent = '− ' + fmtMoney(t.discount);
  if (el('bl_gst')) el('bl_gst').textContent = '+ ' + fmtMoney(t.taxAmount);
  el('bl_grand').textContent = fmtMoney(t.total);
  el('bl_due').textContent = fmtMoney(Math.max(0, t.total - num(bill.paid)));
}

function billPaidFull() {
  bill.paid = bill._totals ? bill._totals.total : 0;
  const inp = el('bl_paid');
  if (inp) inp.value = bill.paid;
  billTotalsRecalc();
}

function saveBill(print) {
  bill.lines = bill.lines.filter(l => num(l.qty) > 0);
  if (bill.lines.length === 0) { toast('Add at least one product to the bill', 'error'); return; }

  // resolve / auto-create customer
  let partyId = null;
  const name = bill.customerName.trim();
  const mobile = bill.mobile.trim();
  if (name || mobile) {
    let p = state.parties.find(x =>
      (mobile && x.phone === mobile) || (name && x.name.toLowerCase() === name.toLowerCase()));
    if (!p) {
      p = { id: uid(), name: name || ('Customer ' + mobile), phone: mobile, email: '', gstin: '', address: '', type: 'customer', openingBalance: 0, openingType: 'receive', createdAt: Date.now() };
      state.parties.push(p);
    } else {
      if (mobile && !p.phone) p.phone = mobile;
    }
    partyId = p.id;
  }

  const discountPct = billDiscountPct();
  const totals = computeTotals(bill.lines, discountPct, state.settings.taxEnabled);
  const t = Object.assign({
    id: uid(), type: 'SALE', number: nextNumber('SALE'), date: todayStr(),
    partyId: partyId, lines: bill.lines, discountPct: round2(discountPct),
    referredBy: bill.referredBy.trim(),
    paid: Math.min(num(bill.paid), totals.total), mode: bill.mode, notes: '', createdAt: Date.now()
  }, totals);
  // cash sales are settled in full unless told otherwise
  if (!partyId && num(bill.paid) === 0) t.paid = t.total;
  state.txns.push(t);
  bumpCounter('SALE');
  save();
  toast('Bill ' + t.number + ' saved — ' + fmtMoney(t.total));
  if (print) printTxn(t.id);
  newBill();
  renderBilling();
}

];

let repState = { key: 'daily', from: addDays(todayStr(), -29), to: todayStr(), partyId: '', stockSearch: '', stockFilter: 'all' };

/* switching report picks a sensible default range for its granularity */
function repSetKey(key) {
  repState.key = key;
  const d = new Date();
  const fyStart = (d.getMonth() >= 3 ? d.getFullYear() : d.getFullYear() - 1) + '-04-01';
  if (key === 'daily') { repState.from = addDays(todayStr(), -29); repState.to = todayStr(); }
  else if (key === 'weekly') { repState.from = addDays(todayStr(), -83); repState.to = todayStr(); }
  else if (key === 'monthly' || key === 'quarterly' || key === 'profit') { repState.from = fyStart; repState.to = todayStr(); }
  else if (key === 'yearly') { repState.from = addDays(fyStart, -730); repState.to = todayStr(); }
  renderReports();
}

function renderReports() {
  const tabs = REPORTS.map(r =>
    '<button class="rtab' + (repState.key === r[0] ? ' active' : '') + '" onclick="repSetKey(\'' + r[0] + '\')">' + r[1] + '</button>'
  ).join('');
  const needsRange = !['stock', 'lowstock', 'allparties'].includes(repState.key);
  const needsParty = repState.key === 'party';

  el('view').innerHTML =
    '<div class="page-head"><h2>Reports</h2></div>' +
    '<div class="rtabs">' + tabs + '</div>' +
    '<div class="card"><div class="rfilters">' +
    (needsRange ?
      '<label>From <input type="date" value="' + repState.from + '" onchange="repState.from=this.value;renderReports()"></label>' +
      '<label>To <input type="date" value="' + repState.to + '" onchange="repState.to=this.value;renderReports()"></label>' +
      '<span class="presets">' +
      '<button class="btn tiny ghost" onclick="setRange(0)">Today</button>' +
      '<button class="btn tiny ghost" onclick="setRange(6)">7 days</button>' +
      '<button class="btn tiny ghost" onclick="setRange(29)">30 days</button>' +
      '<button class="btn tiny ghost" onclick="setRangeMonth()">This month</button>' +
      '<button class="btn tiny ghost" onclick="setRangeFY()">This FY</button></span>' : '') +
    (needsParty ? '<label>Party <select onchange="repState.partyId=this.value;renderReports()">' +
      '<option value="">— select —</option>' +
      state.parties.slice().sort((a, b) => a.name.localeCompare(b.name)).map(p => '<option value="' + p.id + '"' + (repState.partyId === p.id ? ' selected' : '') + '>' + esc(p.name) + '</option>').join('') +
      '</select></label>' : '') +
    '<span style="margin-left:auto;display:flex;gap:8px">' +

    '<button class="btn ghost" onclick="exportCurrentReport()">⬇ Export CSV</button>' +

/* Stock Availability table — filtered by the search box and All/Stock/No Stock radios.
   Column naming per shop convention: Item = product name, Product = category. */
function renderStockTable() {
  const wrap = el('stockTblWrap');
  if (!wrap) return;
  const q = (repState.stockSearch || '').trim().toLowerCase();
  const f = repState.stockFilter || 'all';
  const severity = (it, stock) => stock <= 0 ? 0 : isLowStock(it) ? 1 : 2;
  const items = state.items.filter(i => i.type !== 'service')
    .map(it => ({ it: it, stock: itemStock(it.id) }))
    .filter(({ it }) => !q || it.name.toLowerCase().includes(q) ||
      (it.brand || '').toLowerCase().includes(q) || (it.category || '').toLowerCase().includes(q))
    .filter(({ stock }) => f === 'all' || (f === 'stock' ? stock > 0 : stock <= 0))
    .sort((a, b) => severity(a.it, a.stock) - severity(b.it, b.stock) || a.it.name.localeCompare(b.it.name));

  let totVal = 0;
  const rows = items.map(({ it, stock }) => {
    const val = Math.max(0, stock) * num(it.purchasePrice || it.salePrice);
    totVal += val;
    const avail = stock <= 0 ? '<span class="badge bad">No Stock</span>'
      : isLowStock(it) ? '<span class="badge warn">▲ ' + fmtQty(stock) + ' ' + esc(it.unit) + '</span>'
        : fmtQty(stock) + ' ' + esc(it.unit);
    return [esc(it.name), esc(it.category || ''), esc(it.brand || ''), avail, fmtMoney(val)];
  });
  wrap.innerHTML = tbl([['Item'], ['Product'], ['Brand'], ['Available Stock', 'r'], ['Stock Value', 'r']], rows,
    ['Total (' + items.length + ' items)', '', '', '', fmtMoney(totVal)]);

  window._lastReportCSV = {
    name: 'stock-availability.csv',
    headers: ['Item', 'Product', 'Brand', 'AvailableStock', 'Status', 'StockValue'],
    rows: items.map(({ it, stock }) => [it.name, it.category, it.brand || '',
      Math.max(0, stock), stock <= 0 ? 'No Stock' : isLowStock(it) ? 'Low Stock' : 'In Stock',
      round2(Math.max(0, stock) * num(it.purchasePrice || it.salePrice))])
  };
}

function setRange(daysBack) { repState.to = todayStr(); repState.from = addDays(todayStr(), -daysBack); renderReports(); }
function setRangeMonth() {
  const d = new Date();
  repState.from = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-01';
  repState.to = todayStr();
  renderReports();
}
function setRangeFY() {
  const d = new Date();
  const fyStartYear = d.getMonth() >= 3 ? d.getFullYear() : d.getFullYear() - 1;
  repState.from = fyStartYear + '-04-01';
  repState.to = todayStr();
  renderReports();
}

function txnsIn(types, from, to) {
  return state.txns
    .filter(t => types.includes(t.type) && inRange(t.date, from, to))
    .sort((a, b) => a.date === b.date ? a.createdAt - b.createdAt : (a.date < b.date ? -1 : 1));
}

function tbl(headers, rows, footRow) {
  let html = '<div class="table-wrap"><table><thead><tr>' +
    headers.map(hd => '<th class="' + (hd[1] || '') + '">' + hd[0] + '</th>').join('') + '</tr></thead><tbody>';
  html += rows.length ? rows.map(r => '<tr>' + r.map((c, i) => '<td class="' + (headers[i][1] || '') + '">' + c + '</td>').join('') + '</tr>').join('')
    : '<tr><td colspan="' + headers.length + '" class="empty">No data for this period.</td></tr>';
  html += '</tbody>';
  if (footRow) html += '<tfoot><tr>' + footRow.map((c, i) => '<td class="' + (headers[i] ? headers[i][1] || '' : '') + '"><strong>' + c + '</strong></td>').join('') + '</tr></tfoot>';
  return html + '</table></div>';
}

/* group a date into a period bucket for the sales-by-period reports */
function periodKey(dateStr, granularity) {
  const [y, m, dd] = dateStr.split('-').map(Number);
  if (granularity === 'daily') return { key: dateStr, label: fmtDate(dateStr) };
  if (granularity === 'weekly') {
    const dt = new Date(dateStr + 'T00:00:00');
    const monday = new Date(dt);
    monday.setDate(dt.getDate() - ((dt.getDay() + 6) % 7));
    const iso = monday.getFullYear() + '-' + String(monday.getMonth() + 1).padStart(2, '0') + '-' + String(monday.getDate()).padStart(2, '0');
    return { key: iso, label: 'Week of ' + fmtDate(iso) };
  }
  if (granularity === 'monthly') return { key: y + '-' + String(m).padStart(2, '0'), label: monthName(m - 1) + ' ' + y };
  const fy = m >= 4 ? y : y - 1;
  if (granularity === 'quarterly') {
    const q = Math.floor(((m - 4 + 12) % 12) / 3) + 1;
    return { key: fy + '-Q' + q, label: 'Q' + q + ' FY ' + fy + '-' + String((fy + 1) % 100).padStart(2, '0') };
  }
  return { key: String(fy), label: 'FY ' + fy + '-' + String((fy + 1) % 100).padStart(2, '0') }; // yearly
}

function buildReport() {
  const k = repState.key, from = repState.from, to = repState.to;
  let html = '', csv = { name: k + '-report.csv', headers: [], rows: [] };

  if (['daily', 'weekly', 'monthly', 'quarterly', 'yearly'].includes(k)) {
    const buckets = {};
    for (const t of txnsIn(['SALE'], from, to)) {
      const p = periodKey(t.date, k);
      if (!buckets[p.key]) buckets[p.key] = { label: p.label, bills: 0, sales: 0, received: 0, profit: 0 };
      const b = buckets[p.key];
      b.bills++; b.sales += num(t.total); b.received += num(t.paid); b.profit += txnProfit(t);
    }
    for (const t of txnsIn(['SALE_RETURN'], from, to)) {
      const p = periodKey(t.date, k);
      if (!buckets[p.key]) buckets[p.key] = { label: p.label, bills: 0, sales: 0, received: 0, profit: 0 };
      buckets[p.key].sales -= num(t.total);
      buckets[p.key].profit += txnProfit(t);
    }
    const keys = Object.keys(buckets).sort();
    let tb = 0, ts = 0, tr = 0, tp = 0;
    const rows = keys.map(key => {
      const b = buckets[key];
      tb += b.bills; ts += b.sales; tr += b.received; tp += b.profit;
      return [esc(b.label), String(b.bills), fmtMoney(b.sales), fmtMoney(b.received),
        '<span class="' + (b.profit >= 0 ? 'pos' : 'neg') + '">' + fmtMoney(b.profit) + '</span>'];
    });
    html = tbl([['Period'], ['Bills', 'r'], ['Sales', 'r'], ['Received', 'r'], ['Profit', 'r']], rows,
      ['Total', String(tb), fmtMoney(ts), fmtMoney(tr), fmtMoney(tp)]);
    csv.headers = ['Period', 'Bills', 'Sales', 'Received', 'Profit'];
    csv.rows = keys.map(key => { const b = buckets[key]; return [b.label, b.bills, round2(b.sales), round2(b.received), round2(b.profit)]; });
  }

  else if (k === 'sale' || k === 'purchase') {
    const type = k === 'sale' ? 'SALE' : 'PURCHASE';
    const list = txnsIn([type], from, to);
    let tot = 0, paid = 0;
    const rows = list.map(t => {
      tot += num(t.total); paid += num(t.paid);
      return [fmtDate(t.date), esc(t.number), esc(partyName(t.partyId)), fmtMoney(t.total), fmtMoney(t.paid), fmtMoney(Math.max(0, num(t.total) - num(t.paid))), txnStatus(t)];
    });
    html = tbl([['Date'], ['Number'], ['Party'], ['Total', 'r'], ['Paid', 'r'], ['Balance', 'r'], ['Status']], rows,
      ['', '', 'Total', fmtMoney(tot), fmtMoney(paid), fmtMoney(tot - paid), '']);
    csv.headers = ['Date', 'Number', 'Party', 'Total', 'Paid', 'Balance', 'Status'];
    csv.rows = list.map(t => [t.date, t.number, partyName(t.partyId), num(t.total), num(t.paid), num(t.total) - num(t.paid), txnStatus(t)]);
  }

  else if (k === 'daybook') {
    const list = txnsIn(Object.keys(TXN_TYPES).filter(t => t !== 'ESTIMATE'), from, to);
    let mIn = 0, mOut = 0;
    const rows = list.map(t => {
      const io = moneyInOut(t);
      mIn += io.in; mOut += io.out;
      return [fmtDate(t.date), TXN_TYPES[t.type].label, esc(t.number), esc(t.type === 'EXPENSE' ? (t.category || '') : partyName(t.partyId)), fmtMoney(t.total),
        io.in ? fmtMoney(io.in) : '—', io.out ? fmtMoney(io.out) : '—'];
    });
    html = tbl([['Date'], ['Type'], ['Number'], ['Party'], ['Total', 'r'], ['Money In', 'r'], ['Money Out', 'r']], rows,
      ['', '', '', 'Total', '', fmtMoney(mIn), fmtMoney(mOut)]);
    csv.headers = ['Date', 'Type', 'Number', 'Party', 'Total', 'MoneyIn', 'MoneyOut'];
    csv.rows = list.map(t => { const io = moneyInOut(t); return [t.date, TXN_TYPES[t.type].label, t.number, partyName(t.partyId), num(t.total), io.in, io.out]; });
  }

  else if (k === 'cashflow') {
    const list = txnsIn(Object.keys(TXN_TYPES).filter(t => t !== 'ESTIMATE'), from, to);
    let mIn = 0, mOut = 0;
    for (const t of list) { const io = moneyInOut(t); mIn += io.in; mOut += io.out; }
    html = '<div class="cards">' +
      '<div class="card stat"><div class="stat-label">Money In</div><div class="stat-value pos">' + fmtMoney(mIn) + '</div></div>' +
      '<div class="card stat"><div class="stat-label">Money Out</div><div class="stat-value neg">' + fmtMoney(mOut) + '</div></div>' +
      '<div class="card stat"><div class="stat-label">Net Cash Flow</div><div class="stat-value ' + (mIn - mOut >= 0 ? 'pos' : 'neg') + '">' + fmtMoney(mIn - mOut) + '</div></div></div>' +
      '<p class="sub">Money In counts amounts actually received (sales receipts + payments in). Money Out counts amounts actually paid (purchases, payments out, expenses, refunds).</p>';
    csv.headers = ['Metric', 'Amount'];
    csv.rows = [['Money In', mIn], ['Money Out', mOut], ['Net', mIn - mOut]];
  }

  else if (k === 'profit') {
    const sum = (types, field) => txnsIn(types, from, to).reduce((s, t) => s + num(t[field || 'total']), 0);
    const sales = sum(['SALE']), saleRet = sum(['SALE_RETURN']);
    const purch = sum(['PURCHASE']), purchRet = sum(['PURCHASE_RETURN']);
    const expenses = sum(['EXPENSE']);
    const taxOut = txnsIn(['SALE'], from, to).reduce((s, t) => s + num(t.taxAmount), 0) - txnsIn(['SALE_RETURN'], from, to).reduce((s, t) => s + num(t.taxAmount), 0);
    const taxIn = txnsIn(['PURCHASE'], from, to).reduce((s, t) => s + num(t.taxAmount), 0) - txnsIn(['PURCHASE_RETURN'], from, to).reduce((s, t) => s + num(t.taxAmount), 0);
    const netSales = sales - saleRet - taxOut;
    const netPurch = purch - purchRet - taxIn;
    const gross = netSales - netPurch;
    const net = gross - expenses;
    const costProfit = txnsIn(['SALE', 'SALE_RETURN'], from, to).reduce((s, t) => s + txnProfit(t), 0);
    const row = (l, v, strong, cls) => '<div class="totals-row' + (strong ? ' grand' : '') + '"><span>' + l + '</span><span class="' + (cls || '') + '">' + fmtMoney(v) + '</span></div>';
    html = '<div class="totals-panel pnl">' +
      row('Gross Margin on items sold (sale price − item cost)', costProfit, false, costProfit >= 0 ? 'pos' : 'neg') +
      row('Margin after expenses', costProfit - expenses, true, costProfit - expenses >= 0 ? 'pos' : 'neg') +
      '<div class="totals-row"><span style="font-weight:700;margin-top:8px">Purchase-based P&amp;L</span><span></span></div>' +
      row('Sales (excl. GST)', sales - taxOut) +
      row('Less: Sale Returns', -(saleRet ? saleRet - (saleRet ? txnsIn(['SALE_RETURN'], from, to).reduce((s, t) => s + num(t.taxAmount), 0) : 0) : 0)) +
      row('Net Sales', netSales, true) +
      row('Purchases (excl. GST)', netPurch) +
      row('Gross Profit', gross, true, gross >= 0 ? 'pos' : 'neg') +
      row('Less: Expenses', -expenses) +
      row('Net Profit', net, true, net >= 0 ? 'pos' : 'neg') +
      '</div><p class="sub">Simplified P&amp;L: purchases in the period are treated as cost of goods (no opening/closing stock valuation).</p>';
    csv.headers = ['Line', 'Amount'];
    csv.rows = [['Net Sales', netSales], ['Purchases', netPurch], ['Gross Profit', gross], ['Expenses', expenses], ['Net Profit', net]];
  }

  else if (k === 'party') {
    if (!repState.partyId) { html = '<p class="empty">Select a party above to view their statement.</p>'; }
    else {
      const p = getParty(repState.partyId);
      const list = txnsIn(Object.keys(TXN_TYPES), null, null).filter(t => t.partyId === p.id);
      let bal = partyOpening(p);
      const pre = list.filter(t => from && t.date < from);
      for (const t of pre) bal += txnDue(t);
      const rows = [['', 'Opening Balance (' + fmtDate(from) + ')', '', '', fmtMoney(Math.abs(bal)) + (bal >= 0 ? ' Dr' : ' Cr')]];
      const inList = list.filter(t => inRange(t.date, from, to));
      for (const t of inList) {
        bal += txnDue(t);
        rows.push([fmtDate(t.date), TXN_TYPES[t.type].label, esc(t.number), fmtMoney(t.total), fmtMoney(Math.abs(bal)) + (bal >= 0 ? ' Dr' : ' Cr')]);
      }
      html = '<h3 class="card-title">' + esc(p.name) + ' — closing balance ' + fmtMoney(Math.abs(bal)) + (bal >= 0 ? ' (to receive)' : ' (to pay)') + '</h3>' +
        tbl([['Date'], ['Type'], ['Number'], ['Amount', 'r'], ['Balance', 'r']], rows);
      csv.headers = ['Date', 'Type', 'Number', 'Amount', 'Balance'];
      csv.rows = rows.map(r => r.map(c => String(c).replace(/<[^>]+>/g, '')));
    }
  }

  else if (k === 'allparties') {
    let recv = 0, pay = 0;
    const rows = state.parties.slice().sort((a, b) => a.name.localeCompare(b.name)).map(p => {
      const b = partyBalance(p.id);
      if (b > 0) recv += b; else pay -= b;
      return [esc(p.name), esc(p.phone || ''), esc(p.type), fmtMoney(Math.abs(b)), b > 0 ? 'To Receive' : b < 0 ? 'To Pay' : '—'];
    });
    html = tbl([['Party'], ['Phone'], ['Type'], ['Balance', 'r'], ['Direction']], rows,
      ['Total', '', '', fmtMoney(recv) + ' Dr / ' + fmtMoney(pay) + ' Cr', '']);
    csv.headers = ['Party', 'Phone', 'Type', 'Balance', 'Direction'];
    csv.rows = state.parties.map(p => { const b = partyBalance(p.id); return [p.name, p.phone, p.type, Math.abs(b), b >= 0 ? 'Receive' : 'Pay']; });
  }

  else if (k === 'stock') {
    // controls live outside the table wrapper so typing in search never
    // rebuilds (and un-focuses) the search box — only the table refreshes
    const f = repState.stockFilter || 'all';
    const radio = (val, label) =>
      '<label class="radio-opt"><input type="radio" name="st_filter" value="' + val + '"' +
      (f === val ? ' checked' : '') + ' onchange="repState.stockFilter=this.value;renderStockTable()"> ' + label + '</label>';
    html = '<div class="rfilters" style="margin-bottom:4px">' +
      '<input id="st_stocksearch" class="search" placeholder="Search item / brand…" value="' + esc(repState.stockSearch || '') + '" oninput="repState.stockSearch=this.value;renderStockTable()">' +
      '<span class="radio-group">' + radio('all', 'All') + radio('stock', 'Stock') + radio('nostock', 'No Stock') + '</span>' +
      '</div><div id="stockTblWrap"></div>';
    // csv is produced by renderStockTable so the export matches the filters
  }

  else if (k === 'productwise' || k === 'categorywise') {
    const map = {};
    for (const t of txnsIn(['SALE'], from, to)) {
      for (const l of (t.lines || [])) {
        let key, name;
        if (k === 'productwise') { key = l.itemId || l.name; name = l.name; }
        else {
          const it = getItem(l.itemId);
          name = (it && it.category) ? it.category : 'Uncategorised';
          key = name;
        }
        if (!map[key]) map[key] = { name: name, qty: 0, amount: 0, profit: 0 };
        map[key].qty += num(l.qty);
        map[key].amount += num(l.amount) + num(l.tax);
        map[key].profit += num(l.amount) - lineCost(l) * num(l.qty);
      }
    }
    const arr = Object.values(map).sort((a, b) => b.amount - a.amount);
    let tq = 0, ta = 0, tp = 0;
    const rows = arr.map(x => {
      tq += x.qty; ta += x.amount; tp += x.profit;
      return [esc(x.name), fmtQty(x.qty), fmtMoney(x.amount),
        '<span class="' + (x.profit >= 0 ? 'pos' : 'neg') + '">' + fmtMoney(x.profit) + '</span>'];
    });
    const first = k === 'productwise' ? 'Product' : 'Category';
    html = tbl([[first], ['Qty Sold', 'r'], ['Sales (incl. GST)', 'r'], ['Profit', 'r']], rows,
      ['Total', fmtQty(tq), fmtMoney(ta), fmtMoney(tp)]);
    csv.headers = [first, 'QtySold', 'Sales', 'Profit'];
    csv.rows = arr.map(x => [x.name, x.qty, round2(x.amount), round2(x.profit)]);
  }

  else if (k === 'customerwise') {
    const map = {};
    for (const t of txnsIn(['SALE'], from, to)) {
      const key = t.partyId || '_cash';
      if (!map[key]) map[key] = { name: partyName(t.partyId), bills: 0, sales: 0, received: 0, profit: 0 };
      const c = map[key];
      c.bills++; c.sales += num(t.total); c.received += num(t.paid); c.profit += txnProfit(t);
    }
    const arr = Object.entries(map).sort((a, b) => b[1].sales - a[1].sales);
    let tb2 = 0, ts = 0, tr = 0, tp = 0;
    const rows = arr.map(([key, c]) => {
      tb2 += c.bills; ts += c.sales; tr += c.received; tp += c.profit;
      const due = key !== '_cash' ? partyBalance(key) : 0;
      return [esc(c.name), String(c.bills), fmtMoney(c.sales), fmtMoney(c.received),
        '<span class="' + (c.profit >= 0 ? 'pos' : 'neg') + '">' + fmtMoney(c.profit) + '</span>',
        key !== '_cash' ? fmtMoney(Math.max(0, due)) : '—'];
    });
    html = tbl([['Customer'], ['Bills', 'r'], ['Sales', 'r'], ['Received', 'r'], ['Profit', 'r'], ['Outstanding', 'r']], rows,
      ['Total', String(tb2), fmtMoney(ts), fmtMoney(tr), fmtMoney(tp), '']);
    csv.headers = ['Customer', 'Bills', 'Sales', 'Received', 'Profit'];
    csv.rows = arr.map(([, c]) => [c.name, c.bills, round2(c.sales), round2(c.received), round2(c.profit)]);
  }

  else if (k === 'expense') {
    const list = txnsIn(['EXPENSE'], from, to);
    const byCat = {};
    let tot = 0;
    for (const t of list) { byCat[t.category || 'Other'] = (byCat[t.category || 'Other'] || 0) + num(t.total); tot += num(t.total); }
    const rows = list.map(t => [fmtDate(t.date), esc(t.number), esc(t.category || ''), esc(t.notes || ''), fmtMoney(t.total)]);
    html = '<div class="cards">' +
      Object.entries(byCat).sort((a, b) => b[1] - a[1]).slice(0, 4).map(c =>
        '<div class="card stat"><div class="stat-label">' + esc(c[0]) + '</div><div class="stat-mid">' + fmtMoney(c[1]) + '</div></div>').join('') +
      '</div>' + tbl([['Date'], ['Number'], ['Category'], ['Notes'], ['Amount', 'r']], rows, ['', '', '', 'Total', fmtMoney(tot)]);
    csv.headers = ['Date', 'Number', 'Category', 'Notes', 'Amount'];
    csv.rows = list.map(t => [t.date, t.number, t.category, t.notes, num(t.total)]);
  }

  else if (k === 'gst') {
    function taxByRate(types) {
      const m = {};
      for (const t of txnsIn(types, from, to)) {
        for (const l of (t.lines || [])) {
          const r = num(l.taxRate);
          if (!m[r]) m[r] = { taxable: 0, tax: 0 };
          m[r].taxable += num(l.amount);
          m[r].tax += num(l.tax);
        }
      }
      return m;
    }
    const out = taxByRate(['SALE']), outRet = taxByRate(['SALE_RETURN']);
    const inn = taxByRate(['PURCHASE']), innRet = taxByRate(['PURCHASE_RETURN']);
    const rates = [...new Set([].concat(Object.keys(out), Object.keys(inn), Object.keys(outRet), Object.keys(innRet)))].map(Number).sort((a, b) => a - b);
    let outputTax = 0, inputTax = 0;
    const rows = rates.map(r => {
      const o = (out[r] ? out[r].tax : 0) - (outRet[r] ? outRet[r].tax : 0);
      const i = (inn[r] ? inn[r].tax : 0) - (innRet[r] ? innRet[r].tax : 0);
      outputTax += o; inputTax += i;
      return [r + '%',
        fmtMoney((out[r] ? out[r].taxable : 0) - (outRet[r] ? outRet[r].taxable : 0)), fmtMoney(o),
        fmtMoney((inn[r] ? inn[r].taxable : 0) - (innRet[r] ? innRet[r].taxable : 0)), fmtMoney(i)];
    });
    html = '<div class="cards">' +
      '<div class="card stat"><div class="stat-label">Output GST (on sales)</div><div class="stat-mid">' + fmtMoney(outputTax) + '</div></div>' +
      '<div class="card stat"><div class="stat-label">Input GST (on purchases)</div><div class="stat-mid">' + fmtMoney(inputTax) + '</div></div>' +
      '<div class="card stat"><div class="stat-label">Net GST Payable</div><div class="stat-value ' + (outputTax - inputTax > 0 ? 'neg' : 'pos') + '">' + fmtMoney(outputTax - inputTax) + '</div></div></div>' +
      tbl([['GST Rate'], ['Sales Taxable', 'r'], ['Output Tax', 'r'], ['Purchase Taxable', 'r'], ['Input Tax', 'r']], rows,
        ['Total', '', fmtMoney(outputTax), '', fmtMoney(inputTax)]) +
      '<p class="sub">Net of credit/debit notes. Use this as a working summary for GSTR filing — verify with your CA.</p>';
    csv.headers = ['Rate', 'SalesTaxable', 'OutputTax', 'PurchaseTaxable', 'InputTax'];
    csv.rows = rows.map(r => r.map(c => String(c).replace('₹ ', '')));
  }

  window._lastReportCSV = csv;
  return { html: html };
}

function moneyInOut(t) {
  switch (t.type) {
    case 'SALE': return { in: num(t.paid), out: 0 };
    case 'PAYMENT_IN': return { in: num(t.total), out: 0 };
    case 'SALE_RETURN': return { in: 0, out: num(t.paid) };
    case 'PURCHASE': return { in: 0, out: num(t.paid) };
    case 'PURCHASE_RETURN': return { in: num(t.paid), out: 0 };
    case 'PAYMENT_OUT': return { in: 0, out: num(t.total) };
    case 'EXPENSE': return { in: 0, out: num(t.total) };
    default: return { in: 0, out: 0 };
  }
}

function exportCurrentReport() {
  const c = window._lastReportCSV;
  if (!c || !c.headers.length) { toast('Nothing to export', 'error'); return; }
  exportTableCSV(c.name, c.headers, c.rows);
}

/* Bill-item level export for the selected date range.
   Bill-level amounts (Bill Total / Received / Due) are written only on the
   first row of each bill so that summing those columns in Excel stays correct. */
function exportDetailedSales() {
  const from = repState.from, to = repState.to;
  const bills = txnsIn(['SALE'], from, to);
  if (!bills.length) { toast('No bills in the selected date range', 'error'); return; }
  const headers = ['Date', 'Bill No', 'Customer Name', 'Contact Number', 'Referred By',
    'Item', 'Brand', 'Description', 'Qty', 'Unit', 'Rate',
    'Line Sales (incl GST)', 'Line Profit/Loss',
    'Bill Total', 'Received', 'Due', 'Status'];
  const rows = [];
  for (const t of bills) {
    const p = t.partyId ? getParty(t.partyId) : null;
    const discFactor = 1 - num(t.discountPct || 0) / 100;
    const due = round2(Math.max(0, num(t.total) - num(t.paid)));
    (t.lines || []).forEach((l, i) => {
      const lineSales = round2((num(l.amount) + num(l.tax)) * discFactor);
      const lineProfit = round2(num(l.amount) * discFactor - lineCost(l) * num(l.qty));
      rows.push([
        fmtDate(t.date), t.number,
        p ? p.name : 'Cash Sale', p ? (p.phone || '') : '', t.referredBy || '',
        l.name, l.brand || '', l.description || '', num(l.qty), l.unit || '', num(l.rate),
        lineSales, lineProfit,
        i === 0 ? num(t.total) : '', i === 0 ? num(t.paid) : '', i === 0 ? due : '',
        i === 0 ? txnStatus(t) : ''
      ]);
    });
  }
  exportTableCSV('sales-detailed-' + from + '-to-' + to + '.csv', headers, rows);
}

  for (const t of state.txns) {
    if (t.date !== today) continue;
    if (t.type === 'SALE') { todaySales += num(t.total); todayProfit += txnProfit(t); todayBills++; }
    if (t.type === 'SALE_RETURN') { todayProfit += txnProfit(t); }
  }

  // monthly sales (daily bars for the current month)
  const d = new Date();
  const mStart = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-01';
  const daysInMonth = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();

    if (t.type === 'SALE' && inRange(t.date, mStart, null) && byDay[t.date] !== undefined) {
      byDay[t.date] += num(t.total);
      if (t.date <= today) monthSales += num(t.total);
    }

  const chartData = Object.keys(byDay).sort().map(dt => ({ label: dt.slice(8), value: byDay[dt] }));

  const low = lowStockItems();

      '<div class="head-actions" style="margin-top:12px">' +

      '<button class="btn ghost" onclick="openItemForm()">2. Add products</button>' +
      '<button class="btn ghost" onclick="go(\'billing\')">3. Start billing</button>' +
      '<button class="btn ghost" onclick="confirmDemo()">Or load demo data</button></div></div>' : '') +
    '<div class="cards">' +
    '<div class="card stat"><div class="stat-label">Today\'s Sales</div><div class="stat-value">' + fmtMoney(todaySales) + '</div></div>' +
    '<div class="card stat"><div class="stat-label">Today\'s Profit</div><div class="stat-value ' + (todayProfit >= 0 ? 'pos' : 'neg') + '">' + fmtMoney(todayProfit) + '</div></div>' +
    '<div class="card stat"><div class="stat-label">Bills Created Today</div><div class="stat-value">' + todayBills + '</div></div>' +

    '<div class="card stat"><div class="stat-label">To Pay</div><div class="stat-mid neg">' + fmtMoney(totals.payable) + '</div></div>' +

    '<div class="head-actions">' +

/* Dashboard stock-availability table — same search + All/Stock/No Stock filter
   as the report; scrolls (sticky header) when more than ~10 rows. */
function renderDashStockTable() {
  const wrap = el('dashStockWrap');
  if (!wrap) return;
  const q = (window._dashStockQ || '').trim().toLowerCase();
  const f = window._dashStockF || 'all';
  const severity = (it, stock) => stock <= 0 ? 0 : isLowStock(it) ? 1 : 2;
  const items = state.items.filter(i => i.type !== 'service')
    .map(it => ({ it: it, stock: itemStock(it.id) }))
    .filter(({ it }) => !q || it.name.toLowerCase().includes(q) ||
      (it.brand || '').toLowerCase().includes(q) || (it.category || '').toLowerCase().includes(q))
    .filter(({ stock }) => f === 'all' || (f === 'stock' ? stock > 0 : stock <= 0))
    .sort((a, b) => severity(a.it, a.stock) - severity(b.it, b.stock) || a.it.name.localeCompare(b.it.name));

  const rows = items.map(({ it, stock }) =>
    '<tr class="rowlink" onclick="openItemDetail(\'' + it.id + '\')">' +
    '<td><strong>' + esc(it.name) + '</strong></td>' +
    '<td>' + esc(it.category || '') + '</td>' +
    '<td>' + esc(it.brand || '') + '</td>' +
    '<td class="r">' + (stock <= 0 ? '<span class="badge bad">No Stock</span>'
      : isLowStock(it) ? '<span class="badge warn">▲ ' + fmtQty(stock) + ' ' + esc(it.unit) + '</span>'
        : fmtQty(stock) + ' ' + esc(it.unit)) + '</td></tr>'
  ).join('');

  wrap.innerHTML = rows ?
    '<div class="table-wrap scroll-y"><table><thead><tr><th>Item</th><th>Product</th><th>Brand</th><th class="r">Available Stock</th></tr></thead><tbody>' +
    rows + '</tbody></table></div>' +
    '<p class="sub">' + items.length + ' product' + (items.length === 1 ? '' : 's') + (items.length > 10 ? ' — scroll for more' : '') + '</p>'
    : '<p class="empty">' + (state.items.length ? 'No matching products.' : 'No products yet — add products in Inventory.') + '</p>';
}

/* VyaparOpen — sync.js : sync data to the user's own Google account.
   Primary: Google Drive via "Continue with Google" (OAuth, no server).
   Fallback: personal Google Apps Script web app link (works from file://).
   One-click sync: newest side wins (compares meta.updatedAt). */
'use strict';

const LAST_SYNC_KEY = 'shopkeeper_last_sync'; // kept outside state so syncing doesn't dirty it
const DRIVE_FILE_NAME = 'Shopkeeper Sync Data.json';
const DRIVE_SCOPES = 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/userinfo.email';

/* The app's own Google registration, baked into the shipped file — exactly how
   WhatsApp ships its registration inside the app so users never see it.
   Empty in the open-source template; the setup wizard's "Download connected
   website file" button fills it in and the owner re-uploads that file. */
const BUILT_IN_CLIENT_ID = '';

function activeClientId() {
  return state.settings.gClientId || BUILT_IN_CLIENT_ID;
}

let _gToken = null, _gTokenExp = 0, _gFresh = false;

const APPS_SCRIPT_CODE =
`function sheet_() {
  var files = DriveApp.getFilesByName('Shopkeeper Sync Data');
  var ss = files.hasNext() ? SpreadsheetApp.open(files.next())
                           : SpreadsheetApp.create('Shopkeeper Sync Data');
  return ss.getSheets()[0];
}
function doGet() {
  var sh = sheet_();
  var last = sh.getLastRow();
  var json = '';
  if (last > 0) {
    var rows = sh.getRange(1, 1, last, 1).getValues();
    for (var i = 0; i < rows.length; i++) json += rows[i][0];
  }
  return ContentService.createTextOutput(json || '{}')
    .setMimeType(ContentService.MimeType.JSON);
}
function doPost(e) {
  var sh = sheet_();
  sh.clearContents();
  var data = e.postData.contents;
  var chunks = [];
  for (var i = 0; i < data.length; i += 45000) chunks.push([data.slice(i, i + 45000)]);
  sh.getRange(1, 1, chunks.length, 1).setValues(chunks);
  return ContentService.createTextOutput('OK');
}`;

/* save without bumping meta.updatedAt — sync settings are not "data",
   and a freshly configured device must not look newer than the cloud copy */
function persistQuiet() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
}

/* Called at boot. A link like https://…/#gcid=xxx (shared from the setup
   screen) carries the Google connection ID to a new device. */
function syncBootstrap() {
  const m = (location.hash || '').match(/gcid=([A-Za-z0-9._-]+)/);
  if (m) {
    state.settings.gClientId = m[1];
    persistQuiet();
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    toast('Google sync link received — tap 🔄 Sync to connect');
  }
  // preload Google's sign-in library so the Sync click can open the popup instantly
  if (activeClientId()) loadGsi().catch(() => {});
}

function lastSyncText() {
  const t = num(localStorage.getItem(LAST_SYNC_KEY));
  if (!t) return (activeClientId() || state.settings.syncUrl) ? 'Not synced yet' : '';
  const d = new Date(t);
  return 'Last sync: ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') +
    ' ' + fmtDate(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'));
}

function updateSyncUI() {
  const info = el('syncInfo');
  if (info) info.textContent = lastSyncText();
  const btn = el('syncBtn');
  if (btn) btn.title = state.settings.syncEmail ? 'Sync (' + state.settings.syncEmail + ')' : 'Set up sync with Google';
}

function setSyncBusy(busy) {
  const btn = el('syncBtn');
  if (!btn) return;
  btn.disabled = busy;
  btn.textContent = busy ? '⏳ Syncing…' : '🔄 Sync';
}

async function syncNowLegacy(force) {
  const s = state.settings;
  if (!activeClientId() && !s.syncUrl) { openSyncSetup(); return; }
  setSyncBusy(true);
  try {
    if (activeClientId()) await driveSync(force);
    else await sheetSync(force);
    localStorage.setItem(LAST_SYNC_KEY, String(Date.now()));
  } catch (e) {
    toast('Sync failed: ' + e.message, 'error');
  }
  setSyncBusy(false);
  updateSyncUI();
}

/* shared decision: what to do given the remote copy and an optional force */
async function applySyncDecision(remote, force, push, where) {
  const rAt = remote && remote.meta ? num(remote.meta.updatedAt) : 0;
  const lAt = state.meta ? num(state.meta.updatedAt) : 0;
  // safety: a device with no data must never overwrite a cloud copy that has data
  const localEmpty = !state.txns.length && !state.items.length && !state.parties.length;
  const remoteHasData = !!(remote && remote.settings);

  if (!force && remoteHasData && localEmpty) {
    applyRemoteState(remote);
    toast('Synced ⬇ — your data downloaded from ' + where);
  } else if (force === 'pull') {
    if (remoteHasData) { applyRemoteState(remote); toast('Downloaded data from ' + where); }
    else toast('No data found in ' + where + ' yet', 'error');
  } else if (force === 'push') {
    await push();
    toast('Uploaded data to ' + where);
  } else if (remoteHasData && rAt > lAt) {
    applyRemoteState(remote);
    toast('Synced ⬇ — newer data downloaded from ' + where);
  } else if (!remoteHasData || lAt > rAt) {
    await push();
    toast('Synced ⬆ — data uploaded to ' + where);
  } else {
    toast('Already up to date ✓');
  }
}

function applyRemoteState(remote) {
  const keepUrl = state.settings.syncUrl, keepEmail = state.settings.syncEmail, keepCid = state.settings.gClientId;
  state = remote;
  const d = defaultState();
  state.settings = Object.assign(d.settings, state.settings || {});
  state.counters = Object.assign(d.counters, state.counters || {});
  state.parties = state.parties || []; state.items = state.items || [];
  state.txns = state.txns || []; state.adjustments = state.adjustments || [];
  if (!state.settings.syncUrl) state.settings.syncUrl = keepUrl;
  if (!state.settings.syncEmail) state.settings.syncEmail = keepEmail;
  if (!state.settings.gClientId) state.settings.gClientId = keepCid;
  save();
  applyTheme();
  const bn = el('bizName');
  if (bn) bn.textContent = state.settings.businessName;
  route();
}

/* ================= Google Drive sync (Continue with Google) ================= */

function loadGsi() {
  if (window.google && google.accounts && google.accounts.oauth2) return Promise.resolve();
  if (window._gsiLoading) return window._gsiLoading;
  window._gsiLoading = new Promise((resolve, reject) => {
    const sc = document.createElement('script');
    sc.src = 'https://accounts.google.com/gsi/client';
    sc.onload = resolve;
    sc.onerror = () => { window._gsiLoading = null; reject(new Error('could not load Google sign-in (check internet)')); };
    document.head.appendChild(sc);
  });
  return window._gsiLoading;
}

function getDriveToken(askConsent) {
  if (_gToken && Date.now() < _gTokenExp - 60000) { _gFresh = false; return Promise.resolve(_gToken); }
  return loadGsi().then(() => new Promise((resolve, reject) => {
    const tc = google.accounts.oauth2.initTokenClient({
      client_id: activeClientId(),
      scope: DRIVE_SCOPES,
      // preselect the account this shop already backs up to
      hint: state.settings.syncEmail || undefined,
      callback: (resp) => {
        if (resp && resp.access_token) {
          _gToken = resp.access_token;
          _gTokenExp = Date.now() + (num(resp.expires_in) || 3600) * 1000;
          _gFresh = true;
          resolve(_gToken);
        } else reject(new Error((resp && resp.error) || 'Google sign-in failed'));
      },
      error_callback: (err) => reject(new Error(err && err.type === 'popup_closed'
        ? 'the Google sign-in window was closed' : 'Google sign-in did not complete'))
    });
    // silent refresh once this device has connected before; full consent screen otherwise
    tc.requestAccessToken({ prompt: (!askConsent && state.settings.syncEmail) ? '' : 'consent' });
  }));
}

async function driveSync(force) {
  let token;
  try { token = await getDriveToken(false); }
  catch (e) { token = await getDriveToken(true); } // silent refresh failed → ask the user
  if (_gFresh) {
    // a newly issued token: make sure it is the SAME Google account this shop
    // backs up to, so data never lands in a different account's Drive
    const email = await fetchGoogleEmail(token);
    const expected = state.settings.syncEmail;
    if (email && expected && email !== expected) {
      _gToken = null;
      throw new Error('you chose ' + email + ' but this shop backs up to ' + expected + ' — please pick ' + expected);
    }
    if (email && !expected) { state.settings.syncEmail = email; persistQuiet(); updateSyncUI(); }
  }
  const fileId = await driveFileId(token);
  const remote = (fileId && force !== 'push') ? await driveDownload(token, fileId) : null;
  await applySyncDecision(remote, force, () => driveUpload(token, fileId), 'your Google Drive');
}

async function fetchGoogleEmail(token) {
  try {
    const res = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', { headers: { Authorization: 'Bearer ' + token } });
    if (res.ok) {
      const j = await res.json();
      return j.email || '';
    }
  } catch (e) {}
  return '';
}

async function driveFileId(token) {
  const q = encodeURIComponent("name='" + DRIVE_FILE_NAME + "' and trashed=false");
  const res = await fetch('https://www.googleapis.com/drive/v3/files?q=' + q + '&fields=files(id)&pageSize=1',
    { headers: { Authorization: 'Bearer ' + token } });
  if (!res.ok) throw new Error('Google Drive search failed (' + res.status + ')');
  const j = await res.json();
  return j.files && j.files[0] ? j.files[0].id : null;
}

async function driveDownload(token, fileId) {
  const res = await fetch('https://www.googleapis.com/drive/v3/files/' + fileId + '?alt=media',
    { headers: { Authorization: 'Bearer ' + token } });
  if (!res.ok) throw new Error('Google Drive download failed (' + res.status + ')');
  try { return JSON.parse(await res.text()); } catch (e) { return null; }
}

async function driveUpload(token, fileId) {
  const body = JSON.stringify(state);
  let res;
  if (fileId) {
    res = await fetch('https://www.googleapis.com/upload/drive/v3/files/' + fileId + '?uploadType=media', {
      method: 'PATCH',
      headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: body
    });
  } else {
    const meta = JSON.stringify({ name: DRIVE_FILE_NAME, mimeType: 'application/json' });
    const bnd = 'shopkeeper' + Date.now();
    res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'multipart/related; boundary=' + bnd },
      body: '--' + bnd + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + meta +
        '\r\n--' + bnd + '\r\nContent-Type: application/json\r\n\r\n' + body + '\r\n--' + bnd + '--'
    });
  }
  if (!res.ok) throw new Error('Google Drive upload failed (' + res.status + ')');
}

/* ================= legacy: Apps Script web app link ================= */

async function sheetSync(force) {
  const s = state.settings;
  let remote = null;
  if (force !== 'push') {
    const res = await fetch(s.syncUrl, { method: 'GET' });
    if (!res.ok) throw new Error('server returned ' + res.status);
    try { remote = JSON.parse(await res.text()); } catch (e) { remote = null; }
  }
  await applySyncDecision(remote, force, pushStateToSheet, 'your Google Sheet');
}

async function pushStateToSheet() {
  const res = await fetch(state.settings.syncUrl, {
    method: 'POST',
    // text/plain avoids a CORS preflight, which Apps Script web apps don't answer
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(state)
  });
  if (!res.ok) throw new Error('upload failed (' + res.status + ')');
}

/* Build a copy of this website file with the owner's Google registration baked
   in (like WhatsApp shipping its own registration inside the app). The owner
   uploads it to their site once; after that no device ever sees setup. */
async function downloadConnectedSite() {
  const cid = activeClientId();
  if (!cid) { toast('Save your Client ID first', 'error'); return; }
  if (BUILT_IN_CLIENT_ID === cid) { toast('This website copy already has Google built in'); return; }
  try {
    const res = await fetch(location.href.split('#')[0], { cache: 'no-store' });
    if (!res.ok) throw new Error('could not read the app file (' + res.status + ')');
    let src = await res.text();
    const needle = "BUILT_IN_CLIENT_ID = '" + "'";   // split so this line doesn't match itself
    if (src.indexOf(needle) < 0) throw new Error('app template marker not found');
    src = src.replace(needle, "BUILT_IN_CLIENT_ID = '" + cid + "'");
    downloadFile('index.html', src, 'text/html;charset=utf-8');
    toast('index.html downloaded — upload it to your website. Every device then syncs automatically.');
  } catch (e) {
    toast('Could not build the file: ' + e.message, 'error');
  }
}

function saveClientId() {
  const cid = el('sy_cid').value.trim();
  if (!/\.apps\.googleusercontent\.com$/.test(cid)) {
    toast('Paste the full Client ID — it ends with .apps.googleusercontent.com', 'error');
    return;

  state.settings.gClientId = cid;
  persistQuiet();
  closeModal();

  syncNow(); // opens Google's "Continue with Google → Allow" window

function saveSyncSetup() {
  const url = el('sy_url').value.trim();

  if (!url || !/^https?:\/\//.test(url)) { toast('Paste the Web App URL (starts with https://)', 'error'); return; }
  state.settings.syncUrl = url;

  closeModal();
  updateSyncUI();
  syncNow();
}


/* VyaparOpen — auth.js : WhatsApp-style login (mobile number + OTP) and the
   first-login "allow Google backup" step. Login is per-device and stored
   outside the synced state, like a SIM registration.

   Honest note: a real SMS needs a paid SMS gateway + server (this app has
   neither), so the OTP is generated on this device and shown on screen —
   it works like an app lock. Plugging in an SMS service later only needs
   sendOtp() to be pointed at it. */
'use strict';

const LOGIN_KEY = 'shopkeeper_login'; // device-local, never synced

let _otp = '', _otpPhone = '', _otpAt = 0;

function currentLogin() {
  try { return JSON.parse(localStorage.getItem(LOGIN_KEY) || 'null'); } catch (e) { return null; }
}

function isLoggedIn() {
  const l = currentLogin();
  return !!(l && l.phone);
}

function renderLogin() {
  if (FIREBASE_READY) { return renderLoginFB(); }
  document.body.classList.remove('modal-open');
  el('app').innerHTML =
    '<div class="login-wrap"><div class="login-card">' +
    '<div class="login-logo">S</div>' +
    '<h1 class="login-title">Shopkeeper</h1>' +
    '<p class="sub" style="margin-bottom:18px">Billing · Inventory · Khata — free &amp; works offline</p>' +
    '<label style="text-align:left">Mobile Number' +
    '<div class="login-phone"><span>+91</span>' +
    '<input id="lg_phone" inputmode="numeric" maxlength="10" placeholder="10-digit mobile number" autocomplete="tel"' +
    ' onkeydown="if(event.key===\'Enter\')sendOtp()"></div></label>' +
    '<button class="btn primary login-btn" onclick="sendOtp()">Get OTP</button>' +
    '<p class="sub" style="margin-top:14px">Your number stays on this device — no account, no server.</p>' +
    '</div></div>';
  const p = el('lg_phone');
  p.focus();
}

function sendOtp() {
  const phone = el('lg_phone') ? el('lg_phone').value.replace(/\D/g, '') : _otpPhone;
  if (!/^[6-9]\d{9}$/.test(phone)) { toast('Enter a valid 10-digit mobile number', 'error'); return; }
  _otpPhone = phone;
  _otp = String(Math.floor(100000 + Math.random() * 900000));
  _otpAt = Date.now();
  renderOtpStep();
}

function renderOtpStep() {
  el('app').innerHTML =
    '<div class="login-wrap"><div class="login-card">' +
    '<div class="login-logo">S</div>' +
    '<h1 class="login-title">Verify OTP</h1>' +
    '<p class="sub">OTP sent to <strong>+91 ' + esc(_otpPhone) + '</strong></p>' +
    '<div class="otp-note">Your OTP: <strong class="otp-code">' + esc(_otp) + '</strong>' +
    '<div class="sub" style="margin-top:4px">Shown here because no SMS service is connected — it works like an app lock. An SMS gateway can be added later.</div></div>' +
    '<label style="text-align:left">Enter OTP' +
    '<input id="lg_otp" inputmode="numeric" maxlength="6" placeholder="6-digit OTP" style="letter-spacing:6px;text-align:center;font-size:18px"' +
    ' onkeydown="if(event.key===\'Enter\')verifyOtp()"></label>' +
    '<button class="btn primary login-btn" onclick="verifyOtp()">Verify &amp; Login</button>' +
    '<div style="margin-top:12px;display:flex;justify-content:space-between">' +
    '<a class="login-link" onclick="renderLogin()">← Change number</a>' +
    '<a class="login-link" onclick="sendOtp()">Resend OTP</a></div>' +
    '</div></div>';
  el('lg_otp').focus();
}

function verifyOtp() {
  const v = el('lg_otp').value.trim();
  if (Date.now() - _otpAt > 5 * 60 * 1000) { toast('OTP expired — tap Resend OTP', 'error'); return; }
  if (v !== _otp) { toast('Wrong OTP — please check and try again', 'error'); return; }
  try { localStorage.setItem(LOGIN_KEY, JSON.stringify({ phone: _otpPhone, at: Date.now() })); } catch (e) {}
  // remember the shop's number on first ever login
  if (!state.settings.phone) { state.settings.phone = _otpPhone; persistQuiet(); }
  _otp = '';
  // WhatsApp-style: on first login, ask to allow Google backup before opening
  if (!state.settings.gClientId && !state.settings.syncUrl) renderSyncAsk();
  else { bootApp(); syncNow(); } // sync already set up → open and sync silently
}

function renderSyncAsk() {
  el('app').innerHTML =
    '<div class="login-wrap"><div class="login-card">' +
    '<div style="font-size:44px">☁️</div>' +
    '<h1 class="login-title">Back up to Google?</h1>' +
    '<p class="sub" style="margin:10px 0 18px">Allow Shopkeeper to save your data to <strong>your own Google account</strong> ' +
    '(like WhatsApp backup). Then your mobile and PC always show the same bills, stock and khata.</p>' +
    '<button class="btn primary login-btn" onclick="allowSyncSetup()">Allow — Connect Google</button>' +
    '<button class="btn ghost login-btn" style="margin-top:10px" onclick="bootApp()">Not now — open the app</button>' +
    '<p class="sub" style="margin-top:14px">You can set this up any time from Settings or the 🔄 Sync button.</p>' +
    '</div></div>';
}

function allowSyncSetup() {
  bootApp();
  syncNow(); // no setup saved yet → opens the Google connect wizard; else Continue with Google
}

function logout() {
  if (FIREBASE_READY && fbAuth) {
    confirmDialog('Log out? Your data stays safe in the cloud and will reload when you sign in again.', () => {
      fbStopSync();
      fbAuth.signOut().then(() => renderLogin());
    });
    return;
  }
  confirmDialog('Log out of this device? Your data stays saved here and in your Google backup.', () => {
    localStorage.removeItem(LOGIN_KEY);
    renderLogin();
  });
}

/* ============================================================
   Shopkeeper — firebase-sync.js
   Firebase Auth (Google + Phone OTP) and per-record Firestore
   sync. Layers on top of the existing local-first app: local
   state + localStorage remain the instant offline cache, Firestore
   is the authoritative multi-device store.

   Data model (per signed-in user):
     users/{uid}                     admin-managed profile
                                     {phone,email,plan,role,active,
                                      createdAt,activatedAt,lastLogin}
     userData/{uid}/parties/{id}     one doc per customer/supplier
     userData/{uid}/items/{id}       one doc per product/service
     userData/{uid}/txns/{id}        one doc per transaction
     userData/{uid}/adjustments/{id} one doc per stock adjustment
     userData/{uid}/meta/settings    business settings (single doc)
     userData/{uid}/meta/counters    invoice-number counters (single doc)
   ============================================================ */
'use strict';

const FIREBASE_READY = !!(
  window.firebase && window.firebaseConfig &&
  window.firebaseConfig.apiKey && window.firebaseConfig.apiKey.indexOf('PASTE_') === -1 &&
  window.firebaseConfig.appId && window.firebaseConfig.appId.indexOf('PASTE_') === -1
);

let fbApp = null, fbAuth = null, fbDb = null;
let _fbUid = null, _fbUnsub = [], _fbApplyingRemote = false, _fbPushTimer = null;
let _fbCache = { parties: {}, items: {}, txns: {}, adjustments: {}, settings: '', counters: '' };
let _fbConfirm = null, _fbRecaptcha = null;
const FB_COLS = ['parties', 'items', 'txns', 'adjustments'];
const FB_UID_KEY = 'shopkeeper_fb_uid';

function fbInit() {
  if (!FIREBASE_READY) return false;
  if (fbApp) return true;
  try {
    fbApp = firebase.initializeApp(window.firebaseConfig);
    fbAuth = firebase.auth();
    fbDb = firebase.firestore();
    // offline persistence: keeps working with no internet, syncs on reconnect
    fbDb.enablePersistence({ synchronizeTabs: true }).catch(() => {});
    return true;
  } catch (e) { console.error('Firebase init failed', e); return false; }
}

/* ---------- auth ---------- */
function fbAuthWatch() {
  fbAuth.onAuthStateChanged(async (user) => {
    if (!user) { fbStopSync(); renderLoginFB(); return; }
    if (_fbUid === user.uid) return; // already signed in & syncing (token refresh)
    try {
      const prof = await fbEnsureProfile(user);
      if (prof && prof.active === false) { fbStopSync(); renderDeactivated(); return; }
      window._fbUser = user; window._fbProfile = prof;
      await fbSyncStart(user.uid);
      bootApp();
      updateSyncUI();
      toast('Signed in — your data is syncing');
    } catch (e) {
      console.error('auth flow error', e);
      toast('Sign-in problem: ' + e.message, 'error');
    }
  });
}

function fbIsBootstrapAdmin(user) {
  const b = window.ADMIN_BOOTSTRAP || {};
  const ph = (user.phoneNumber || '').replace(/\D/g, '');
  const em = (user.email || '').toLowerCase();
  const phones = (b.phones || []).map(x => String(x).replace(/\D/g, ''));
  const emails = (b.emails || []).map(x => String(x).toLowerCase());
  return (!!ph && phones.indexOf(ph) >= 0) || (!!em && emails.indexOf(em) >= 0);
}

async function fbEnsureProfile(user) {
  const ref = fbDb.collection('users').doc(user.uid);
  const snap = await ref.get();
  const now = firebase.firestore.FieldValue.serverTimestamp();
  const boot = fbIsBootstrapAdmin(user);
  if (!snap.exists) {
    const prof = {
      uid: user.uid,
      phone: user.phoneNumber || '',
      email: user.email || '',
      displayName: user.displayName || '',
      provider: (user.providerData[0] && user.providerData[0].providerId) || '',
      plan: 'free',
      role: boot ? 'admin' : 'user',
      active: true,
      createdAt: now, activatedAt: now, lastLogin: now
    };
    await ref.set(prof);
    return Object.assign({}, prof, { active: true });
  }
  const data = snap.data();
  const upd = { lastLogin: now };
  if (boot && data.role !== 'admin') upd.role = 'admin';
  await ref.set(upd, { merge: true });
  return Object.assign({}, data, upd);
}

/* ---------- sync: start / stop ---------- */
async function fbSyncStart(uid) {
  _fbUid = uid;
  _fbCache = { parties: {}, items: {}, txns: {}, adjustments: {}, settings: '', counters: '' };

  // Guard against leaking one account's local data into another account that
  // signs in on the same browser: if the device's cached state belongs to a
  // different uid, start clean before deciding whether to seed the cloud.
  const prevUid = localStorage.getItem(FB_UID_KEY);
  if (prevUid && prevUid !== uid) { state = defaultState(); persistQuiet(); }
  localStorage.setItem(FB_UID_KEY, uid);

  // First-ever login for this account: cloud is empty → push this device's
  // data up as the starting point (so nothing is lost). Otherwise the cloud is
  // authoritative and the listeners below will hydrate local state from it.
  const settingsDoc = await fbDb.collection('userData').doc(uid).collection('meta').doc('settings').get();
  if (!settingsDoc.exists) { await fbPushAll(); }

  fbAttachListeners();
}

function fbStopSync() {
  (_fbUnsub || []).forEach(u => { try { u(); } catch (e) {} });
  _fbUnsub = [];
  _fbUid = null;
  clearTimeout(_fbPushTimer);
}

/* ---------- sync: inbound (Firestore → local) ---------- */
function fbAttachListeners() {
  const root = fbDb.collection('userData').doc(_fbUid);
  FB_COLS.forEach(col => {
    _fbUnsub.push(root.collection(col).onSnapshot(snap => {
      if (snap.metadata.hasPendingWrites) return; // ignore our own local echoes
      const arr = snap.docs.map(d => d.data());
      state[col] = arr;
      _fbCache[col] = {};
      arr.forEach(r => { if (r && r.id) _fbCache[col][r.id] = JSON.stringify(r); });
      fbApplyRemote(false);
    }, err => console.error('snapshot ' + col, err)));
  });
  const meta = root.collection('meta');
  _fbUnsub.push(meta.doc('settings').onSnapshot(d => {
    if (!d.exists || d.metadata.hasPendingWrites) return;
    state.settings = Object.assign(defaultState().settings, d.data());
    _fbCache.settings = JSON.stringify(state.settings);
    fbApplyRemote(true);
  }, err => console.error('snapshot settings', err)));
  _fbUnsub.push(meta.doc('counters').onSnapshot(d => {
    if (!d.exists || d.metadata.hasPendingWrites) return;
    state.counters = Object.assign(defaultState().counters, d.data());
    _fbCache.counters = JSON.stringify(state.counters);
    fbApplyRemote(false);
  }, err => console.error('snapshot counters', err)));
}

function fbApplyRemote(themeToo) {
  _fbApplyingRemote = true;
  try { persistQuiet(); } catch (e) {}
  _fbApplyingRemote = false;
  if (themeToo && typeof applyTheme === 'function') applyTheme();
  fbRerender();
}

function fbRerender() {
  if (el('bizName')) el('bizName').textContent = state.settings.businessName;
  if (typeof updateSyncUI === 'function') updateSyncUI();
  // don't tear down an open form/modal the user is editing
  if (document.body.classList.contains('modal-open')) return;
  if (el('view')) { try { route(); } catch (e) {} }
}

/* ---------- sync: outbound (local → Firestore) ---------- */
function fbOnLocalSave() {
  if (!_fbUid || _fbApplyingRemote) return;
  clearTimeout(_fbPushTimer);
  _fbPushTimer = setTimeout(() => {
    fbPushAll().then(fbMarkSynced).catch(e => console.error('sync push failed', e));
  }, 700);
}

async function fbPushCol(col) {
  const base = fbDb.collection('userData').doc(_fbUid).collection(col);
  const arr = state[col] || [];
  const seen = {};
  const ops = [];
  for (const rec of arr) {
    if (!rec || !rec.id) continue;
    seen[rec.id] = 1;
    const js = JSON.stringify(rec);
    if (_fbCache[col][rec.id] !== js) { ops.push(base.doc(rec.id).set(rec)); _fbCache[col][rec.id] = js; }
  }
  for (const id in _fbCache[col]) {
    if (!seen[id]) { ops.push(base.doc(id).delete()); delete _fbCache[col][id]; }
  }
  return ops;
}

async function fbPushMeta() {
  const meta = fbDb.collection('userData').doc(_fbUid).collection('meta');
  const ops = [];
  const sj = JSON.stringify(state.settings);
  if (sj !== _fbCache.settings) { ops.push(meta.doc('settings').set(state.settings)); _fbCache.settings = sj; }
  const cj = JSON.stringify(state.counters);
  if (cj !== _fbCache.counters) { ops.push(meta.doc('counters').set(state.counters)); _fbCache.counters = cj; }
  return ops;
}

async function fbPushAll() {
  if (!_fbUid) return;
  let ops = [];
  for (const col of FB_COLS) ops = ops.concat(await fbPushCol(col));
  ops = ops.concat(await fbPushMeta());
  if (ops.length) await Promise.all(ops);
}

function fbMarkSynced() {
  try { localStorage.setItem(LAST_SYNC_KEY, String(Date.now())); } catch (e) {}
  if (typeof updateSyncUI === 'function') updateSyncUI();
}

/* Manual 🔄 Sync button: force a push in Firebase mode, else fall back to the
   original Google-Drive/Apps-Script sync when the app is in local-only mode. */
async function syncNow(force) {
  if (FIREBASE_READY && _fbUid) {
    if (typeof setSyncBusy === 'function') setSyncBusy(true);
    try { await fbPushAll(); fbMarkSynced(); toast('Synced'); }
    catch (e) { toast('Sync failed: ' + e.message, 'error'); }
    finally { if (typeof setSyncBusy === 'function') setSyncBusy(false); }
    return;
  }
  return syncNowLegacy(force);
}

  </script>
