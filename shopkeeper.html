<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopkeeper — Free Business Manager (Billing · Inventory · GST)</title>
  <meta name="description" content="Shopkeeper — free, open-source GST billing, inventory, parties, payments, expenses and reports. 100% offline — your data never leaves your device.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%232a78d6'/><text x='50' y='72' font-size='60' font-weight='bold' text-anchor='middle' fill='white' font-family='sans-serif'>S</text></svg>">
  <style>
/* VyaparOpen — style.css */
/* Touch&Tint-inspired theme: red primary accents, teal sidebar, white cards */
:root {
  --page: #eef4f5;
  --surface: #ffffff;
  --ink: #16232a;
  --ink-2: #4c5b63;
  --muted: #84939b;
  --grid: #e2eaec;
  --baseline: #c2d0d4;
  --border: rgba(14, 68, 80, 0.10);
  --primary: #d92027;
  --primary-strong: #b0161c;
  --accent: #14a3b8;
  --accent-strong: #0d8093;
  --good: #006300;
  --bad: #d03b3b;
  --warn-bg: #fdf3d7;
  --warn-ink: #7a5800;
  --ok-bg: #e2f3e2;
  --ok-ink: #006300;
  --bad-bg: #fbe4e4;
  --bad-ink: #a02c2c;
  --info-bg: #dff4f7;
  --info-ink: #0d8093;
  --sidebar-bg: #14a3b8;
  --sidebar-ink: #eaf7f9;
  --shadow: 0 1px 3px rgba(14, 68, 80, 0.10);
}
:root[data-theme="dark"] {
  --page: #0c1214;
  --surface: #161f22;
  --ink: #ffffff;
  --ink-2: #bfccd1;
  --muted: #84939b;
  --grid: #263135;
  --baseline: #35454a;
  --border: rgba(255, 255, 255, 0.10);
  --primary: #ef5350;
  --primary-strong: #f28b89;
  --accent: #2cb5c9;
  --accent-strong: #6ed0de;
  --good: #0ca30c;
  --bad: #e66767;
  --warn-bg: #3a2f10;
  --warn-ink: #f0c66a;
  --ok-bg: #12300f;
  --ok-ink: #7ed67e;
  --bad-bg: #3a1414;
  --bad-ink: #f0a3a3;
  --info-bg: #0e3238;
  --info-ink: #6ed0de;
  --sidebar-bg: #0a333b;
  --sidebar-ink: #a8c6cc;
  --shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  background: var(--page);
  color: var(--ink);
}
body.modal-open { overflow: hidden; }

#app { display: flex; min-height: 100vh; }

/* ---------- sidebar ---------- */
.sidebar {
  width: 220px; flex: 0 0 220px;
  background: var(--sidebar-bg); color: var(--sidebar-ink);
  display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh;
}
.brand { display: flex; gap: 10px; align-items: center; padding: 16px 14px; background: var(--primary); border-bottom: 1px solid rgba(255,255,255,0.15); }
.logo {
  width: 36px; height: 36px; border-radius: 50%; flex: 0 0 36px;
  background: #fff; color: var(--primary); font-weight: 800; font-size: 20px;
  display: flex; align-items: center; justify-content: center;
}
.brand-name { font-weight: 700; color: #fff; }
.brand-biz { font-size: 11.5px; color: #ffe3e3; opacity: 0.95; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sidebar nav { flex: 1; padding: 8px 0; overflow-y: auto; }
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 16px; cursor: pointer; font-size: 13.5px;
  border-left: 3px solid transparent; user-select: none;
}
.nav-item:hover { background: rgba(255,255,255,0.14); color: #fff; }
.nav-item.active { background: rgba(255,255,255,0.22); color: #fff; border-left-color: #fff; font-weight: 700; }
.nav-item .ico { width: 20px; text-align: center; }
.sidebar-foot { padding: 12px 16px; font-size: 11px; opacity: 0.8; border-top: 1px solid rgba(255,255,255,0.08); }

/* ---------- main ---------- */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar {
  display: flex; align-items: center; gap: 10px;
  background: var(--surface); border-bottom: 1px solid var(--grid); padding: 8px 12px;
  position: sticky; top: 0; z-index: 20;
}
.topbar-title { font-weight: 700; flex: 1; }
.hamburger { display: none; background: none; border: 1px solid var(--grid); border-radius: 8px; font-size: 18px; padding: 3px 10px; color: var(--ink); cursor: pointer; }
#syncInfo { margin-right: 2px; }
main#view { padding: 20px 24px 60px; max-width: 1200px; width: 100%; margin: 0 auto; }

.page-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; }
.page-head h2 { margin: 0; font-size: 21px; }
.crumb { color: var(--primary); cursor: pointer; text-decoration: none; }
.crumb:hover { text-decoration: underline; }
.head-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* ---------- cards & stats ---------- */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 16px; padding: 16px; box-shadow: var(--shadow); margin-bottom: 16px;
}
.cards .card { margin-bottom: 0; }
.card-title { margin: 0 0 12px; font-size: 15px; }
.stat-label { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.stat-value { font-size: 22px; font-weight: 700; }
.stat-mid { font-size: 17px; font-weight: 600; }
.pos { color: var(--good); }
.neg { color: var(--bad); }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.welcome h3 { margin: 0 0 6px; }
.welcome p { margin: 0; color: var(--ink-2); }

/* ---------- tables ---------- */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th {
  text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.4px;
  color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--baseline);
  white-space: nowrap;
}
td { padding: 9px 10px; border-bottom: 1px solid var(--grid); vertical-align: middle; }
tfoot td { border-top: 2px solid var(--baseline); border-bottom: none; }
th.r, td.r { text-align: right; }
tr.rowlink { cursor: pointer; }
tr.rowlink:hover td { background: color-mix(in srgb, var(--primary) 6%, transparent); }
.sub { font-size: 11.5px; color: var(--muted); }
.empty { text-align: center; color: var(--muted); padding: 26px 10px !important; }
.actions { white-space: nowrap; }

.badge {
  display: inline-block; padding: 2px 9px; border-radius: 999px;
  font-size: 11px; font-weight: 700;
}
.badge.ok { background: var(--ok-bg); color: var(--ok-ink); }
.badge.warn { background: var(--warn-bg); color: var(--warn-ink); }
.badge.bad { background: var(--bad-bg); color: var(--bad-ink); }
.badge.info { background: var(--info-bg); color: var(--info-ink); }
.tag {
  display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11.5px;
  background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent-strong);
  text-transform: capitalize;
}

/* ---------- buttons & inputs ---------- */
.btn {
  border: 1px solid transparent; border-radius: 999px; padding: 8px 16px;
  font: inherit; font-weight: 600; cursor: pointer; white-space: nowrap;
}
.btn.primary { background: var(--primary); color: #fff; }
.btn.primary:hover { background: var(--primary-strong); }
.btn.ghost { background: var(--surface); border-color: var(--baseline); color: var(--ink); }
.btn.ghost:hover { border-color: var(--primary); color: var(--primary); }
.btn.danger { background: var(--bad); color: #fff; }
.btn.danger-ghost { background: none; border-color: transparent; color: var(--bad); }
.btn.danger-ghost:hover { background: var(--bad-bg); }
.btn.tiny { padding: 3px 10px; font-size: 12px; border-radius: 999px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

input, select, textarea {
  font: inherit; color: var(--ink); background: var(--surface);
  border: 1px solid var(--baseline); border-radius: 999px; padding: 7px 14px; width: 100%;
}
textarea { border-radius: 14px; }
input:focus, select:focus, textarea:focus { outline: 2px solid color-mix(in srgb, var(--primary) 45%, transparent); border-color: var(--primary); }
input.r { text-align: right; }
.search { width: 220px; }
label { display: block; font-size: 12.5px; color: var(--ink-2); font-weight: 600; }
label input, label select, label textarea { margin-top: 4px; font-weight: 400; }
.switch-row { display: flex; align-items: center; gap: 8px; padding: 7px 0; font-size: 13.5px; font-weight: 500; }
.switch-row input { width: auto; }

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-grid-4 { grid-template-columns: 2fr 1fr 1fr 1fr; }
.span2 { grid-column: span 2; }
.notes { margin-top: 12px; }

/* ---------- modal ---------- */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(11, 11, 11, 0.45);
  display: flex; align-items: flex-start; justify-content: center;
  padding: 5vh 14px; z-index: 100; overflow-y: auto;
}
.modal {
  background: var(--surface); border-radius: 18px; width: 560px; max-width: 100%;
  box-shadow: 0 12px 40px rgba(0,0,0,0.25); border: 1px solid var(--border);
}
.modal-wide { width: 900px; }
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--grid); }
.modal-head h3 { margin: 0; font-size: 16px; }
.modal-head .x { background: none; border: none; font-size: 22px; cursor: pointer; color: var(--muted); line-height: 1; }
.modal-body { padding: 16px 18px; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 13px 18px; border-top: 1px solid var(--grid); }

/* lines table in txn form */
.lines-table input, .lines-table select { padding: 5px 7px; min-width: 60px; }
.lines-table td { padding: 5px 4px; }
.lines-table .amt { font-weight: 600; white-space: nowrap; }

.totals-panel {
  margin: 14px 0 0 auto; max-width: 400px; min-width: 300px;
  border-top: 2px solid var(--baseline); padding-top: 8px;
}
.totals-row > span { white-space: nowrap; }
.totals-panel.pnl { margin: 0 auto; max-width: 460px; border-top: none; }
.totals-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; font-size: 13.5px; color: var(--ink-2); gap: 10px; }
.totals-row.grand { font-size: 16px; font-weight: 800; color: var(--ink); border-top: 1px solid var(--grid); margin-top: 4px; padding-top: 8px; }
.totals-row.due { font-weight: 700; color: var(--bad); }

/* ---------- billing / product picker ---------- */
.form-grid-3 { grid-template-columns: 1fr 1fr 1fr; }
.add-item-row {
  display: grid; grid-template-columns: 1fr 1.5fr 1fr 1.6fr auto;
  gap: 12px; align-items: end; margin-top: 12px;
  padding: 12px; border: 1px dashed var(--accent); border-radius: 16px;
  background: color-mix(in srgb, var(--accent) 6%, transparent);
}
@media (max-width: 860px) {
  .add-item-row { grid-template-columns: 1fr 1fr; }
  .add-item-row button { grid-column: span 2; }
}
.product-picker {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
  gap: 8px; margin-top: 14px;
}
.product-chip {
  display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
  border: 1px solid var(--baseline); border-radius: 14px; background: var(--surface);
  padding: 9px 12px; cursor: pointer; font: inherit; text-align: left; color: var(--ink);
}
.product-chip:hover { border-color: var(--primary); box-shadow: 0 0 0 2px color-mix(in srgb, var(--primary) 25%, transparent); }
.product-chip.out { opacity: 0.55; }
.pc-name { font-weight: 600; font-size: 13px; }
.pc-meta { font-size: 11.5px; color: var(--muted); }
.line-desc {
  margin-top: 4px; font-size: 12px; padding: 4px 8px;
  border-style: dashed; color: var(--ink-2); min-width: 220px;
}
.line-desc:focus { border-style: solid; }
.qty-ctl { display: flex; align-items: center; gap: 4px; }
.qty-ctl input { width: 64px; }
.bill-foot { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; }
.bill-pay { min-width: 180px; }
.minibar { height: 4px; background: var(--grid); border-radius: 2px; margin-top: 5px; max-width: 220px; }
.minibar span { display: block; height: 100%; border-radius: 2px; background: var(--primary); }

/* ---------- reports ---------- */
.rtabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.rtab {
  border: 1px solid var(--accent); background: var(--surface); color: var(--accent-strong);
  padding: 6px 12px; border-radius: 999px; cursor: pointer; font: inherit; font-size: 12.5px; font-weight: 600;
}
.rtab.active { background: var(--primary); border-color: var(--primary); color: #fff; }
.rfilters { display: flex; gap: 12px; align-items: end; flex-wrap: wrap; margin-bottom: 14px; }
.rfilters label { display: flex; align-items: center; gap: 6px; }
.radio-group { display: flex; gap: 16px; align-items: center; padding: 6px 14px; border: 1px solid var(--baseline); border-radius: 999px; background: var(--surface); }
.radio-opt { display: flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--ink-2); }
.radio-opt input { width: auto; accent-color: var(--primary); cursor: pointer; }

/* khata */
.avatar {
  display: inline-flex; align-items: center; justify-content: center;
  width: 34px; height: 34px; border-radius: 50%; font-weight: 700;
  background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent-strong);
}
.khata-head { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; font-size: 14px; }
.btn.wa { background: #25d366; color: #fff; border-color: transparent; }
.btn.wa:hover { background: #1eb857; }

/* scrollable table body (~10 rows visible) with sticky header */
.scroll-y { max-height: 420px; overflow-y: auto; }
.scroll-y thead th { position: sticky; top: 0; background: var(--surface); z-index: 1; box-shadow: 0 1px 0 var(--baseline); }
.rfilters input, .rfilters select { width: auto; }
.presets { display: flex; gap: 6px; }

/* ---------- chart ---------- */
.chart { width: 100%; height: auto; display: block; }
.chart .bar { fill: var(--primary); }
.chart .bar-g:hover .bar { fill: var(--primary-strong); }
.chart .grid { stroke: var(--grid); stroke-width: 1; }
.chart .baseline { stroke: var(--baseline); stroke-width: 1; }
.chart .axis-label { fill: var(--muted); font-size: 11px; }

/* ---------- toast ---------- */
#toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
  background: var(--ink); color: var(--page); padding: 10px 20px; border-radius: 999px;
  font-size: 13.5px; font-weight: 600; opacity: 0; transition: all 0.25s; z-index: 200;
  pointer-events: none; max-width: 90vw;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast.error { background: var(--bad); color: #fff; }

/* ---------- responsive ---------- */
@media (max-width: 860px) {
  .sidebar {
    position: fixed; z-index: 60; height: 100vh; left: -240px; transition: left 0.2s;
  }
  .sidebar.open { left: 0; box-shadow: 0 0 0 100vmax rgba(0,0,0,0.35); }
  .hamburger { display: block; }
  main#view { padding: 14px 12px 60px; }
  .grid-2 { grid-template-columns: 1fr; }
  .form-grid, .form-grid-4 { grid-template-columns: 1fr; }
  .span2 { grid-column: span 1; }
  .search { width: 140px; }
}

/* ---------- login (mobile + OTP) ---------- */
.login-wrap {
  flex: 1; min-height: 100vh; display: flex; align-items: center; justify-content: center;
  padding: 20px; background: linear-gradient(160deg, var(--primary) 0%, var(--primary-strong) 55%, #7a0f13 100%);
}
.login-card {
  width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--border);
  border-radius: 18px; padding: 30px 26px; text-align: center; box-shadow: 0 18px 50px rgba(0,0,0,0.30);
}
.login-logo {
  width: 58px; height: 58px; margin: 0 auto 10px; border-radius: 16px; background: var(--primary);
  color: #fff; font-weight: 800; font-size: 30px; display: flex; align-items: center; justify-content: center;
}
.login-title { margin: 0 0 4px; font-size: 22px; color: var(--ink); }
.login-card label { display: block; font-size: 12px; font-weight: 600; color: var(--ink-2); margin: 14px 0 4px; }
.login-card input {
  width: 100%; padding: 11px 12px; border: 1px solid var(--baseline); border-radius: 10px;
  font-size: 15px; background: var(--surface); color: var(--ink);
}
.login-phone { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
.login-phone span {
  padding: 11px 12px; border: 1px solid var(--baseline); border-radius: 10px;
  font-size: 15px; font-weight: 600; color: var(--ink-2); background: var(--surface);
}
.login-btn { width: 100%; margin-top: 16px; padding: 12px; font-size: 15px; }
.login-link { color: var(--primary); font-size: 13px; font-weight: 600; cursor: pointer; }
.otp-note {
  margin: 14px 0 2px; padding: 10px 12px; border: 1.5px dashed var(--primary); border-radius: 12px;
  font-size: 13px; color: var(--ink-2); background: color-mix(in srgb, var(--primary) 6%, transparent);
}
.otp-code { font-size: 22px; letter-spacing: 5px; color: var(--primary); }

</style>
</head>

  <script>
/* VyaparOpen — utils.js : formatting, DOM helpers, toasts, modals, CSV, SVG charts */
'use strict';

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function num(v) {
  const n = parseFloat(v);
  return isNaN(n) ? 0 : n;
}

function round2(n) {
  return Math.round((n + Number.EPSILON) * 100) / 100;
}

/* Indian-style currency formatting: ₹ 1,23,456.78 */
function fmtMoney(n, withSymbol) {
  n = round2(num(n));
  const s = Math.abs(n).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return (n < 0 ? '-' : '') + (withSymbol === false ? '' : '₹ ') + s;
}

function fmtQty(n) {
  n = num(n);
  return Number.isInteger(n) ? String(n) : n.toLocaleString('en-IN', { maximumFractionDigits: 3 });
}

function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function fmtDate(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-');
  return d + '/' + m + '/' + y;
}

function monthName(m) {
  return ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][m];
}

function addDays(iso, days) {
  const d = new Date(iso + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function inRange(dateStr, from, to) {
  if (from && dateStr < from) return false;
  if (to && dateStr > to) return false;
  return true;
}

function el(id) { return document.getElementById(id); }

function h(html) {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstChild;
}

/* ---------- toast ---------- */
let _toastTimer = null;
function toast(msg, kind) {
  let t = el('toast');
  if (!t) {
    t = h('<div id="toast"></div>');
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.className = 'show' + (kind === 'error' ? ' error' : '');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => { t.className = ''; }, 2600);
}

/* ---------- modal ---------- */
function openModal(html, wide) {
  closeModal();
  const overlay = h(
    '<div class="modal-overlay" id="modalOverlay">' +
    '<div class="modal' + (wide ? ' modal-wide' : '') + '" role="dialog">' + html + '</div></div>'
  );
  overlay.addEventListener('mousedown', (e) => { if (e.target === overlay) closeModal(); });
  document.body.appendChild(overlay);
  document.body.classList.add('modal-open');
  // focus synchronously — a delayed focus() steals focus from whatever field
  // the user has already clicked into and their keystrokes land in the wrong box
  const first = overlay.querySelector('input,select,textarea');
  if (first) first.focus();
}

function closeModal() {
  const o = el('modalOverlay');
  if (o) o.remove();
  document.body.classList.remove('modal-open');
}

document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

function confirmDialog(msg, onYes) {
  openModal(
    '<div class="modal-head"><h3>Please confirm</h3></div>' +
    '<div class="modal-body"><p>' + esc(msg) + '</p></div>' +
    '<div class="modal-foot">' +
    '<button class="btn ghost" onclick="closeModal()">Cancel</button>' +
    '<button class="btn danger" id="confirmYes">Delete</button></div>'
  );
  el('confirmYes').addEventListener('click', () => { closeModal(); onYes(); });
}

/* ---------- file download / CSV ---------- */
function downloadFile(name, content, mime) {
  const blob = new Blob([content], { type: mime || 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

function toCSV(rows) {
  return rows.map(r => r.map(c => {
    c = String(c == null ? '' : c);
    return /[",\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c;
  }).join(',')).join('\n');
}

function exportTableCSV(name, headers, rows) {
  downloadFile(name, toCSV([headers].concat(rows)), 'text/csv;charset=utf-8');
  toast('Exported ' + name);
}

/* ---------- SVG charts (no external libs) ----------
   Colors follow the app palette custom properties (see style.css):
   --series-1 for the single sales series; text uses ink tokens. */

function svgBarChart(data, opts) {
  // data: [{label, value}], opts: {height, valueFmt}
  const H = (opts && opts.height) || 220;
  const W = 720, padL = 56, padR = 12, padT = 14, padB = 30;
  const iw = W - padL - padR, ih = H - padT - padB;
  const max = Math.max(1, ...data.map(d => d.value));
  const step = iw / Math.max(1, data.length);
  const barW = Math.max(4, Math.min(34, step - 4));
  const fmt = (opts && opts.valueFmt) || (v => fmtMoney(v));
  let s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" aria-label="Bar chart">';
  // gridlines (4 hairlines) + y labels
  for (let i = 0; i <= 4; i++) {
    const y = padT + ih - (ih * i / 4);
    const v = max * i / 4;
    s += '<line x1="' + padL + '" y1="' + y + '" x2="' + (W - padR) + '" y2="' + y + '" class="grid"/>';
    s += '<text x="' + (padL - 8) + '" y="' + (y + 4) + '" class="axis-label" text-anchor="end">' + shortMoney(v) + '</text>';
  }
  // bars
  data.forEach((d, i) => {
    const x = padL + i * step + (step - barW) / 2;
    const bh = Math.round(ih * d.value / max);
    const y = padT + ih - bh;
    s += '<g class="bar-g"><title>' + esc(d.label) + ': ' + esc(fmt(d.value)) + '</title>';
    if (d.value > 0) {
      s += '<rect x="' + x + '" y="' + y + '" width="' + barW + '" height="' + bh + '" rx="3" class="bar"/>';
    }
    s += '<rect x="' + (padL + i * step) + '" y="' + padT + '" width="' + step + '" height="' + ih + '" fill="transparent"/></g>';
    // x labels — show at most ~10
    const every = Math.ceil(data.length / 10);
    if (i % every === 0) {
      s += '<text x="' + (x + barW / 2) + '" y="' + (H - 8) + '" class="axis-label" text-anchor="middle">' + esc(d.label) + '</text>';
    }
  });
  s += '<line x1="' + padL + '" y1="' + (padT + ih) + '" x2="' + (W - padR) + '" y2="' + (padT + ih) + '" class="baseline"/>';
  s += '</svg>';
  return s;
}

function shortMoney(v) {
  v = num(v);
  if (Math.abs(v) >= 10000000) return (v / 10000000).toFixed(1).replace(/\.0$/, '') + 'Cr';
  if (Math.abs(v) >= 100000) return (v / 100000).toFixed(1).replace(/\.0$/, '') + 'L';
  if (Math.abs(v) >= 1000) return (v / 1000).toFixed(1).replace(/\.0$/, '') + 'k';
  return String(Math.round(v));
}

/* number → words (Indian system) for invoice printing */
function amountInWords(n) {
  n = Math.round(num(n) * 100) / 100;
  const ones = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve',
    'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
  const tens = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
  function two(x) { return x < 20 ? ones[x] : tens[Math.floor(x / 10)] + (x % 10 ? ' ' + ones[x % 10] : ''); }
  function words(x) {
    if (x === 0) return 'Zero';
    let out = '';
    if (x >= 10000000) { out += words(Math.floor(x / 10000000)) + ' Crore '; x %= 10000000; }
    if (x >= 100000) { out += two(Math.floor(x / 100000)) + ' Lakh '; x %= 100000; }
    if (x >= 1000) { out += two(Math.floor(x / 1000)) + ' Thousand '; x %= 1000; }
    if (x >= 100) { out += ones[Math.floor(x / 100)] + ' Hundred '; x %= 100; }
    if (x > 0) out += two(x) + ' ';
    return out.trim();
  }
  const rup = Math.floor(n), pai = Math.round((n - rup) * 100);
  let s = words(rup) + ' Rupees';
  if (pai > 0) s += ' and ' + words(pai) + ' Paise';
  return s + ' Only';
}


/* VyaparOpen — store.js : persistence + business calculations */
'use strict';

const STORE_KEY = 'vyaparopen_data_v1';

const TXN_TYPES = {
  SALE:            { label: 'Sale Invoice',   prefix: 'INV',  party: 'customer', stock: -1, balance: +1 },
  SALE_RETURN:     { label: 'Credit Note',    prefix: 'CRN',  party: 'customer', stock: +1, balance: -1 },
  ESTIMATE:        { label: 'Estimate',       prefix: 'EST',  party: 'customer', stock: 0,  balance: 0 },
  PURCHASE:        { label: 'Purchase Bill',  prefix: 'PUR',  party: 'supplier', stock: +1, balance: -1 },
  PURCHASE_RETURN: { label: 'Debit Note',     prefix: 'DBN',  party: 'supplier', stock: -1, balance: +1 },
  PAYMENT_IN:      { label: 'Payment In',     prefix: 'RCPT', party: 'customer', stock: 0,  balance: -1 },
  PAYMENT_OUT:     { label: 'Payment Out',    prefix: 'PAY',  party: 'supplier', stock: 0,  balance: +1 },
  EXPENSE:         { label: 'Expense',        prefix: 'EXP',  party: 'supplier', stock: 0,  balance: 0 }
};

const PAY_MODES = ['Cash', 'UPI', 'Bank Transfer', 'Card', 'Cheque', 'Credit'];
const UNITS = ['PCS', 'KG', 'GM', 'LTR', 'ML', 'MTR', 'BOX', 'DOZEN', 'BAG', 'BOTTLE', 'PACKET', 'PAIR', 'SET', 'HOUR', 'DAY', 'SERVICE'];
const GST_RATES = [0, 0.25, 3, 5, 12, 18, 28];
const EXPENSE_CATEGORIES = ['Rent', 'Salary', 'Electricity', 'Transport', 'Telephone & Internet', 'Tea & Refreshments', 'Repairs', 'Marketing', 'Stationery', 'Fuel', 'Insurance', 'Other'];

function defaultState() {
  return {
    version: 1,
    settings: {
      businessName: 'My Business',
      tagline: '',
      address: '',
      phone: '',
      email: '',
      gstin: '',
      taxEnabled: true,
      theme: 'light',
      terms: 'Thanks for doing business with us!',
      upiId: '',
      signatureName: '',
      gClientId: '',   // Google OAuth Client ID for Drive sync
      syncUrl: '',     // legacy Apps Script web-app link sync
      syncEmail: ''
    },
    counters: { SALE: 1, SALE_RETURN: 1, ESTIMATE: 1, PURCHASE: 1, PURCHASE_RETURN: 1, PAYMENT_IN: 1, PAYMENT_OUT: 1, EXPENSE: 1 },
    parties: [],
    items: [],
    txns: [],
    adjustments: []
  };
}

let state = load();

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      // merge over defaults so new fields appear after upgrades
      const d = defaultState();
      s.settings = Object.assign(d.settings, s.settings || {});
      s.counters = Object.assign(d.counters, s.counters || {});
      s.parties = s.parties || []; s.items = s.items || [];
      s.txns = s.txns || []; s.adjustments = s.adjustments || [];
      return s;
    }
  } catch (e) { console.error('load failed', e); }
  return defaultState();
}

function save() {
  try {
    state.meta = state.meta || {};
    state.meta.updatedAt = Date.now();
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
    if (typeof fbOnLocalSave === 'function') fbOnLocalSave(); // push changes to cloud
  } catch (e) {
    toast('Could not save data: ' + e.message, 'error');
  }
}

function nextNumber(type) {
  return TXN_TYPES[type].prefix + '-' + String(state.counters[type]).padStart(4, '0');
}

function bumpCounter(type) {
  state.counters[type]++;
}

/* ---------- lookups ---------- */
function getParty(id) { return state.parties.find(p => p.id === id) || null; }
function getItem(id) { return state.items.find(i => i.id === id) || null; }
function getTxn(id) { return state.txns.find(t => t.id === id) || null; }
function partyName(id) {
  const p = getParty(id);
  return p ? p.name : 'Cash Sale';
}

/* ---------- balances ----------
   Party balance sign convention: positive = party owes us (receivable),
   negative = we owe the party (payable). */
function partyOpening(p) {
  const v = num(p.openingBalance);
  return p.openingType === 'pay' ? -v : v;
}

function txnDue(t) {
  const cfg = TXN_TYPES[t.type];
  if (cfg.balance === 0) return 0;
  if (t.type === 'PAYMENT_IN') return -num(t.total);
  if (t.type === 'PAYMENT_OUT') return num(t.total);
  return cfg.balance * (num(t.total) - num(t.paid));
}

function partyBalance(partyId) {
  const p = getParty(partyId);
  if (!p) return 0;
  let bal = partyOpening(p);
  for (const t of state.txns) {
    if (t.partyId === partyId) bal += txnDue(t);
  }
  return round2(bal);
}

function totalsReceivablePayable() {
  let recv = 0, pay = 0;
  for (const p of state.parties) {
    const b = partyBalance(p.id);
    if (b > 0) recv += b; else pay += -b;
  }
  return { receivable: round2(recv), payable: round2(pay) };
}

/* ---------- stock ---------- */
function itemStock(itemId) {
  const it = getItem(itemId);
  if (!it || it.type === 'service') return 0;
  let qty = num(it.openingStock);
  for (const t of state.txns) {
    const dir = TXN_TYPES[t.type].stock;
    if (!dir || !t.lines) continue;
    for (const l of t.lines) {
      if (l.itemId === itemId) qty += dir * num(l.qty);
    }
  }
  for (const a of state.adjustments) {
    if (a.itemId === itemId) qty += num(a.delta);
  }
  return round2(qty);
}

function stockValue() {
  let v = 0;
  for (const it of state.items) {
    if (it.type === 'service') continue;
    v += Math.max(0, itemStock(it.id)) * num(it.purchasePrice || it.salePrice);
  }
  return round2(v);
}

function isLowStock(it) {
  if (it.type === 'service') return false;
  const stock = itemStock(it.id);
  // out of stock always alerts; otherwise alert at/below the item's min level
  return stock <= 0 || (num(it.minStock) > 0 && stock <= num(it.minStock));
}

function lowStockItems() {
  return state.items.filter(isLowStock);
}

/* ---------- txn helpers ---------- */
function txnStatus(t) {
  const cfg = TXN_TYPES[t.type];
  if (t.type === 'ESTIMATE') return t.convertedTo ? 'Converted' : 'Open';
  if (cfg.balance === 0 || t.type === 'PAYMENT_IN' || t.type === 'PAYMENT_OUT') return 'Paid';
  const due = num(t.total) - num(t.paid);
  if (due <= 0.005) return 'Paid';
  if (num(t.paid) > 0) return 'Partial';
  return 'Unpaid';
}

/* ---------- profit ----------
   Profit on a sale = net taxable revenue (after discounts, excl. GST)
   minus cost of goods. Cost is snapshotted on the line at billing time
   (l.cost); falls back to the item's current purchase price. */
function lineCost(l) {
  if (l.cost != null) return num(l.cost);
  const it = getItem(l.itemId);
  return it ? num(it.purchasePrice) : 0;
}

function txnProfit(t) {
  if (t.type !== 'SALE' && t.type !== 'SALE_RETURN') return 0;
  const revenue = num(t.subtotal) - num(t.discount);
  let cost = 0;
  for (const l of (t.lines || [])) cost += lineCost(l) * num(l.qty);
  const p = round2(revenue - cost);
  return t.type === 'SALE' ? p : -p;
}

/* GST split: if both GSTINs exist and state codes (first 2 digits) differ → IGST, else CGST+SGST */
function taxSplitFor(t) {
  const p = t.partyId ? getParty(t.partyId) : null;
  const biz = (state.settings.gstin || '').slice(0, 2);
  const par = (p && p.gstin ? p.gstin : '').slice(0, 2);
  if (biz && par && biz !== par) return 'IGST';
  return 'CGST_SGST';
}

/* compute line + txn totals from a draft txn's lines & discount */
function computeTotals(lines, discountPct, taxEnabled) {
  let subtotal = 0, taxAmount = 0;
  for (const l of lines) {
    const gross = num(l.qty) * num(l.rate);
    const lineDisc = gross * num(l.disc || 0) / 100;
    const taxable = gross - lineDisc;
    const tax = taxEnabled ? taxable * num(l.taxRate || 0) / 100 : 0;
    l.amount = round2(taxable);
    l.tax = round2(tax);
    subtotal += taxable;
    taxAmount += tax;
  }
  const discount = subtotal * num(discountPct || 0) / 100;
  // overall discount applied on taxable value proportionally reduces tax too
  const taxAfter = subtotal > 0 ? taxAmount * (1 - num(discountPct || 0) / 100) : 0;
  const raw = subtotal - discount + taxAfter;
  const total = Math.round(raw);
  return {
    subtotal: round2(subtotal),
    discount: round2(discount),
    taxAmount: round2(taxAfter),
    roundOff: round2(total - raw),
    total: round2(total)
  };
}

function deleteTxn(id) {
  state.txns = state.txns.filter(t => t.id !== id);
  save();
}

/* ---------- backup / restore ---------- */
function exportBackup() {
  downloadFile('shopkeeper-backup-' + todayStr() + '.json', JSON.stringify(state, null, 2), 'application/json');
  toast('Backup downloaded');
}

function importBackup(file, done) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const s = JSON.parse(r.result);
      if (!s || !s.settings || !Array.isArray(s.txns)) throw new Error('Not a Shopkeeper backup file');
      state = s;
      // re-merge defaults for forward compatibility
      const d = defaultState();
      state.settings = Object.assign(d.settings, state.settings);
      state.counters = Object.assign(d.counters, state.counters || {});
      state.parties = state.parties || []; state.items = state.items || [];
      state.txns = state.txns || []; state.adjustments = state.adjustments || [];
      save();
      done(true);
    } catch (e) {
      done(false, e.message);
    }
  };
  r.readAsText(file);
}

/* VyaparOpen — parties.js : Khata (customers & suppliers ledger book) */
'use strict';

function partyLastActivity(id) {
  let last = null;
  for (const t of state.txns) {
    if (t.partyId === id && (!last || t.date > last)) last = t.date;
  }
  return last;
}

function renderParties() {
  const tab = window._khataTab || 'customer';
  const q = (window._partySearch || '').toLowerCase();

  const inTab = p => p.type === tab || p.type === 'both';
  const all = state.parties.filter(inTab);
  const list = all
    .filter(p => !q || p.name.toLowerCase().includes(q) || (p.phone || '').includes(q))
    .sort((a, b) => {
      const la = partyLastActivity(a.id) || '', lb = partyLastActivity(b.id) || '';
      return la === lb ? a.name.localeCompare(b.name) : (la < lb ? 1 : -1);
    });

  // khata totals for this tab: get = they owe us, give = we owe them
  let get = 0, give = 0;
  for (const p of all) {
    const b = partyBalance(p.id);
    if (b > 0) get += b; else give += -b;
  }

  const nCust = state.parties.filter(p => p.type === 'customer' || p.type === 'both').length;
  const nSupp = state.parties.filter(p => p.type === 'supplier' || p.type === 'both').length;
  const ktab = (key, label) =>
    '<button class="rtab' + (tab === key ? ' active' : '') + '" onclick="_khataTab=\'' + key + '\';renderParties()">' + label + '</button>';

  let rows = list.map(p => {
    const bal = partyBalance(p.id);
    const last = partyLastActivity(p.id);
    const dir = bal > 0 ? '<div class="sub" style="color:var(--bad)">YOU\'LL GET</div>'
      : bal < 0 ? '<div class="sub" style="color:var(--good)">YOU\'LL GIVE</div>' : '<div class="sub">Settled</div>';
    const amtCls = bal > 0 ? 'neg' : bal < 0 ? 'pos' : '';
    return '<tr class="rowlink" onclick="openPartyLedger(\'' + p.id + '\')">' +
      '<td><span class="avatar">' + esc((p.name || '?')[0].toUpperCase()) + '</span></td>' +
      '<td><strong>' + esc(p.name) + '</strong><div class="sub">' + esc(p.phone || '') +
      (last ? ' · last ' + fmtDate(last) : '') + '</div></td>' +
      '<td class="r"><span class="' + amtCls + '" style="font-weight:700">' + fmtMoney(Math.abs(bal)) + '</span>' + dir + '</td>' +

function saveParty(id) {
  const name = el('pf_name').value.trim();
  if (!name) { toast('Name is required', 'error'); return; }
  const gstin = el('pf_gstin').value.trim().toUpperCase();
  if (gstin && gstin.length !== 15) { toast('GSTIN must be 15 characters', 'error'); return; }
  const data = {
    name: name,
    phone: el('pf_phone').value.trim(),
    email: el('pf_email').value.trim(),
    gstin: gstin,
    type: el('pf_type').value,
    address: el('pf_addr').value.trim(),
    openingBalance: num(el('pf_open').value),
    openingType: el('pf_opentype').value
  };
  if (id) {
    Object.assign(getParty(id), data);
  } else {
    state.parties.push(Object.assign({ id: uid(), createdAt: Date.now() }, data));
  }
  save();
  closeModal();
  toast('Saved');
  route();
}

function deleteParty(id) {
  const used = state.txns.some(t => t.partyId === id);
  if (used) { toast('Cannot delete: this party has transactions. Delete those first.', 'error'); return; }
  confirmDialog('Delete this party permanently?', () => {
    state.parties = state.parties.filter(p => p.id !== id);
    save();
    toast('Deleted');
    renderParties();
  });
}

/* ---------- party ledger / khata statement ---------- */
function openPartyLedger(id) {
  const p = getParty(id);
  if (!p) return;
  const entries = state.txns
    .filter(t => t.partyId === id)
    .sort((a, b) => a.date === b.date ? a.createdAt - b.createdAt : (a.date < b.date ? -1 : 1));

  let bal = partyOpening(p);
  let rows = '<tr><td></td><td>Opening Balance</td><td></td><td class="r"></td><td class="r"></td>' +
    '<td class="r"><strong>' + fmtMoney(Math.abs(bal)) + ' ' + (bal >= 0 ? 'Dr' : 'Cr') + '</strong></td></tr>';
  for (const t of entries) {
    const eff = txnDue(t);
    bal += eff;
    rows += '<tr class="rowlink" onclick="viewTxn(\'' + t.id + '\')">' +
      '<td>' + fmtDate(t.date) + '</td>' +
      '<td>' + TXN_TYPES[t.type].label + '</td>' +
      '<td>' + esc(t.number) + '</td>' +
      '<td class="r">' + fmtMoney(t.total) + '</td>' +
      '<td class="r">' + (num(t.paid) && TXN_TYPES[t.type].balance !== 0 && t.type.indexOf('PAYMENT') !== 0 ? fmtMoney(t.paid) : '—') + '</td>' +
      '<td class="r">' + fmtMoney(Math.abs(bal)) + ' ' + (bal >= 0 ? 'Dr' : 'Cr') + '</td></tr>';
  }
  const finalBal = partyBalance(id);
  const isSupp = p.type === 'supplier' || p.type === 'both';
  el('view').innerHTML =
    '<div class="page-head"><h2><a class="crumb" onclick="go(\'parties\')">Khata</a> › ' + esc(p.name) + '</h2>' +
    '<div class="head-actions">' +
    '<button class="btn ghost" onclick="openPartyForm(\'' + id + '\')">Edit</button>' +
    '<button class="btn ghost" onclick="openTxnForm(\'PAYMENT_OUT\',null,\'' + id + '\')">You Gave ₹ (Pay Out)</button>' +
    '<button class="btn primary" onclick="openTxnForm(\'PAYMENT_IN\',null,\'' + id + '\')">You Got ₹ (Pay In)</button>' +
    (isSupp ? '<button class="btn ghost" onclick="openTxnForm(\'PURCHASE\',null,\'' + id + '\')">+ Purchase</button>' : '') +
    '<button class="btn primary" onclick="openTxnForm(\'SALE\',null,\'' + id + '\')">+ Sale</button></div></div>' +
    '<div class="cards">' +
    '<div class="card stat"><div class="stat-label">Phone</div><div class="stat-mid">' + esc(p.phone || '—') + '</div></div>' +
    '<div class="card stat"><div class="stat-label">GSTIN</div><div class="stat-mid">' + esc(p.gstin || '—') + '</div></div>' +
    '<div class="card stat"><div class="stat-label">' + (finalBal >= 0 ? 'You\'ll Get' : 'You\'ll Give') + '</div>' +
    '<div class="stat-value ' + (finalBal >= 0 ? 'neg' : 'pos') + '">' + fmtMoney(Math.abs(finalBal)) + '</div></div></div>' +
    '<div class="card"><h3 class="card-title">Khata Statement</h3><div class="table-wrap"><table><thead><tr>' +
    '<th>Date</th><th>Type</th><th>Number</th><th class="r">Total</th><th class="r">Paid/Recd</th><th class="r">Balance</th></tr></thead><tbody>' +
    rows + '</tbody></table></div></div>';
}


/* VyaparOpen — items.js : inventory / products & services */
'use strict';

function renderItems() {
  const q = (window._itemSearch || '').toLowerCase();
  const list = state.items
    .filter(i => !q || i.name.toLowerCase().includes(q) || (i.category || '').toLowerCase().includes(q))
    .sort((a, b) => a.name.localeCompare(b.name));
  const low = lowStockItems();

  let rows = list.map(it => {
    const stock = itemStock(it.id);
    const isLow = isLowStock(it);
    return '<tr class="rowlink" onclick="openItemDetail(\'' + it.id + '\')">' +
      '<td><strong>' + esc(it.name) + '</strong><div class="sub">' + [it.brand, it.category, it.hsn ? 'HSN ' + it.hsn : ''].filter(Boolean).map(esc).join(' · ') + '</div></td>' +
      '<td><span class="tag">' + (it.type === 'service' ? 'Service' : 'Product') + '</span></td>' +
      '<td class="r">' + fmtMoney(it.salePrice) + '</td>' +
      '<td class="r">' + fmtMoney(it.purchasePrice) + '</td>' +
      '<td class="r">' + num(it.taxRate) + '%</td>' +
      '<td class="r">' + (it.type === 'service' ? '—' :
        stock <= 0 ? '<span class="badge bad">No Stock</span>' :
          (isLow ? '<span class="badge warn" title="Low stock alert">▲ ' : '<span>') + fmtQty(stock) + ' ' + esc(it.unit) + '</span>') + '</td>' +
      '<td class="r actions" onclick="event.stopPropagation()">' +
      (it.type !== 'service' ?
        '<button class="btn tiny ghost" onclick="openStockAdjust(\'' + it.id + '\',1)">Stock In</button> ' +
        '<button class="btn tiny ghost" onclick="openStockAdjust(\'' + it.id + '\',-1)">Stock Out</button> ' : '') +
      '<button class="btn tiny ghost" onclick="openItemForm(\'' + it.id + '\')">Edit</button> ' +
      '<button class="btn tiny danger-ghost" onclick="deleteItem(\'' + it.id + '\')">Delete</button></td></tr>';

    '<div class="page-head"><h2>Inventory</h2>' +
    '<div class="head-actions">' +
    '<input class="search" placeholder="Search products…" value="' + esc(window._itemSearch || '') + '" oninput="_itemSearch=this.value;renderItems()">' +
    '<button class="btn ghost" onclick="openImportModal(\'items\')">⬆ Import</button>' +
    '<button class="btn primary" onclick="openItemForm()">+ Add Product</button></div></div>' +
    '<div class="cards">' +
    '<div class="card stat"><div class="stat-label">Stock Value (at purchase price)</div><div class="stat-value">' + fmtMoney(stockValue()) + '</div></div>' +
    '<div class="card stat"><div class="stat-label">Low Stock Items</div><div class="stat-value ' + (low.length ? 'neg' : '') + '">' + low.length + '</div></div>' +
    '</div>' +

    rows + '</tbody></table></div></div>';

    '<div class="span2" id="if_stockwrap" style="display:' + (it && it.type === 'service' ? 'none' : 'grid') + ';grid-template-columns:1fr 1fr;gap:12px">' +

function saveItem(id) {
  const name = el('if_name').value.trim();
  if (!name) { toast('Item name is required', 'error'); return; }
  const data = {
    name: name,
    type: el('if_type').value,
    category: el('if_cat').value.trim(),
    brand: el('if_brand').value.trim(),
    unit: el('if_unit').value,
    hsn: el('if_hsn').value.trim(),
    description: el('if_desc').value.trim(),
    salePrice: num(el('if_sale').value),
    purchasePrice: num(el('if_pur').value),
    taxRate: num(el('if_tax').value),
    openingStock: num(el('if_open').value),
    minStock: num(el('if_min').value)
  };
  if (id) Object.assign(getItem(id), data);
  else state.items.push(Object.assign({ id: uid(), createdAt: Date.now() }, data));
  save();
  closeModal();
  toast('Item saved');
  route();
}

function deleteItem(id) {
  const used = state.txns.some(t => (t.lines || []).some(l => l.itemId === id));
  if (used) { toast('Cannot delete: item is used in transactions.', 'error'); return; }
  confirmDialog('Delete this item permanently?', () => {
    state.items = state.items.filter(i => i.id !== id);
    state.adjustments = state.adjustments.filter(a => a.itemId !== id);
    save();
    toast('Item deleted');
    renderItems();
  });
}

function openStockAdjust(id, dir) {
  const it = getItem(id);
  openModal(
    '<div class="modal-head"><h3>' + (dir === -1 ? 'Stock Out' : 'Stock In') + ' — ' + esc(it.name) + '</h3><button class="x" onclick="closeModal()">×</button></div>' +
    '<div class="modal-body"><div class="form-grid">' +
    '<label>Adjustment<select id="sa_dir"><option value="1"' + (dir !== -1 ? ' selected' : '') + '>Stock In (+)</option><option value="-1"' + (dir === -1 ? ' selected' : '') + '>Stock Out (−)</option></select></label>' +
    '<label>Quantity<input id="sa_qty" type="number" step="any" min="0" value="1"></label>' +
    '<label>Date<input id="sa_date" type="date" value="' + todayStr() + '"></label>' +
    '<label>Reason<input id="sa_note" placeholder="e.g. damage, recount"></label>' +
    '</div><p class="sub">Current stock: ' + fmtQty(itemStock(id)) + ' ' + esc(it.unit) + '</p></div>' +
    '<div class="modal-foot"><button class="btn ghost" onclick="closeModal()">Cancel</button>' +
    '<button class="btn primary" onclick="saveStockAdjust(\'' + id + '\')">Adjust</button></div>'
  );
}

function saveStockAdjust(id) {
  const qty = num(el('sa_qty').value);
  if (qty <= 0) { toast('Enter a quantity', 'error'); return; }
  state.adjustments.push({
    id: uid(), itemId: id, date: el('sa_date').value || todayStr(),
    delta: qty * num(el('sa_dir').value), note: el('sa_note').value.trim(), createdAt: Date.now()
  });
  save();
  closeModal();
  toast('Stock adjusted');
  route();
}

function openItemDetail(id) {
  const it = getItem(id);
  if (!it) return;
  const moves = [];
  for (const t of state.txns) {
    const dir = TXN_TYPES[t.type].stock;
    for (const l of (t.lines || [])) {
      if (l.itemId === id) moves.push({ date: t.date, label: TXN_TYPES[t.type].label + ' ' + t.number, qty: dir * num(l.qty), rate: num(l.rate), txnId: t.id, at: t.createdAt });
    }
  }
  for (const a of state.adjustments) {
    if (a.itemId === id) moves.push({ date: a.date, label: 'Stock Adjustment' + (a.note ? ' — ' + a.note : ''), qty: num(a.delta), rate: null, at: a.createdAt || 0 });
  }
  moves.sort((a, b) => a.date === b.date ? a.at - b.at : (a.date < b.date ? -1 : 1));

  let run = num(it.openingStock);
  let rows = it.type === 'service' ? '' :
    '<tr><td></td><td>Opening Stock</td><td class="r"></td><td class="r"></td><td class="r">' + fmtQty(run) + '</td></tr>';
  for (const m of moves) {
    run += m.qty;
    rows += '<tr' + (m.txnId ? ' class="rowlink" onclick="viewTxn(\'' + m.txnId + '\')"' : '') + '>' +
      '<td>' + fmtDate(m.date) + '</td><td>' + esc(m.label) + '</td>' +
      '<td class="r ' + (m.qty >= 0 ? 'pos' : 'neg') + '">' + (m.qty >= 0 ? '+' : '') + fmtQty(m.qty) + '</td>' +
      '<td class="r">' + (m.rate != null ? fmtMoney(m.rate) : '—') + '</td>' +
      '<td class="r">' + fmtQty(run) + '</td></tr>';
  }
  if (!rows) rows = '<tr><td colspan="5" class="empty">No movements yet.</td></tr>';

  el('view').innerHTML =
    '<div class="page-head"><h2><a class="crumb" onclick="go(\'items\')">Inventory</a> › ' + esc(it.name) + '</h2>' +
    '<div class="head-actions"><button class="btn ghost" onclick="openItemForm(\'' + id + '\')">Edit</button>' +
    (it.type !== 'service' ?
      '<button class="btn primary" onclick="openStockAdjust(\'' + id + '\',1)">Stock In</button>' +
      '<button class="btn ghost" onclick="openStockAdjust(\'' + id + '\',-1)">Stock Out</button>' : '') +
    '</div></div>' +
    '<div class="cards">' +
    '<div class="card stat"><div class="stat-label">Sale Price</div><div class="stat-value">' + fmtMoney(it.salePrice) + '</div></div>' +
    '<div class="card stat"><div class="stat-label">Purchase Price</div><div class="stat-value">' + fmtMoney(it.purchasePrice) + '</div></div>' +
    '<div class="card stat"><div class="stat-label">Current Stock</div><div class="stat-value">' +
    (it.type === 'service' ? '—' : itemStock(id) <= 0 ? '<span class="neg">No Stock</span>' : fmtQty(itemStock(id)) + ' ' + esc(it.unit)) + '</div></div>' +
    '<div class="card stat"><div class="stat-label">GST Rate</div><div class="stat-value">' + num(it.taxRate) + '%</div></div></div>' +
    '<div class="card"><h3 class="card-title">Stock Movement</h3><div class="table-wrap"><table><thead><tr>' +
    '<th>Date</th><th>Transaction</th><th class="r">Qty</th><th class="r">Rate</th><th class="r">Stock After</th></tr></thead><tbody>' +
    rows + '</tbody></table></div></div>';
}


/* VyaparOpen — txns.js : sales, purchases, returns, estimates, payments, expenses */
'use strict';

const LIST_DEFS = {
  sales:     { title: 'Sales',      types: ['SALE'],            add: [['SALE', '+ New Sale']] },
  estimates: { title: 'Estimates / Quotations', types: ['ESTIMATE'], add: [['ESTIMATE', '+ New Estimate']] },
  purchases: { title: 'Purchases',  types: ['PURCHASE'],        add: [['PURCHASE', '+ New Purchase']] },
  returns:   { title: 'Credit / Debit Notes', types: ['SALE_RETURN', 'PURCHASE_RETURN'], add: [['SALE_RETURN', '+ Credit Note (Sale Return)'], ['PURCHASE_RETURN', '+ Debit Note (Purchase Return)']] },
  payments:  { title: 'Payments',   types: ['PAYMENT_IN', 'PAYMENT_OUT'], add: [['PAYMENT_IN', '+ Payment In'], ['PAYMENT_OUT', '+ Payment Out']] },
  expenses:  { title: 'Expenses',   types: ['EXPENSE'],         add: [['EXPENSE', '+ New Expense']] }
};

function renderTxnList(defKey) {
  const def = LIST_DEFS[defKey];
  const q = (window._txnSearch || '').toLowerCase();
  const list = state.txns
    .filter(t => def.types.includes(t.type))
    .filter(t => !q || t.number.toLowerCase().includes(q) || partyName(t.partyId).toLowerCase().includes(q))
    .sort((a, b) => a.date === b.date ? b.createdAt - a.createdAt : (a.date < b.date ? 1 : -1));

  const totalAmt = list.reduce((s, t) => s + num(t.total), 0);
  const totalDue = list.reduce((s, t) => s + (TXN_TYPES[t.type].balance !== 0 && !t.type.startsWith('PAYMENT') ? Math.max(0, num(t.total) - num(t.paid)) : 0), 0);

  let rows = list.map(t => {
    const st = txnStatus(t);
    const badge = st === 'Paid' || st === 'Converted' ? 'ok' : st === 'Partial' ? 'warn' : st === 'Open' ? 'info' : 'bad';
    return '<tr class="rowlink" onclick="viewTxn(\'' + t.id + '\')">' +
      '<td>' + fmtDate(t.date) + '</td>' +
      '<td>' + esc(t.number) + '<div class="sub">' + TXN_TYPES[t.type].label + '</div></td>' +
      '<td>' + esc(t.type === 'EXPENSE' ? (t.category || 'Expense') : partyName(t.partyId)) + '</td>' +
      '<td class="r">' + fmtMoney(t.total) + '</td>' +
      '<td class="r">' + (TXN_TYPES[t.type].balance !== 0 && !t.type.startsWith('PAYMENT') ? fmtMoney(Math.max(0, num(t.total) - num(t.paid))) : '—') + '</td>' +
      '<td><span class="badge ' + badge + '">' + st + '</span></td>' +
      '<td class="r actions" onclick="event.stopPropagation()">' +
      (t.type === 'ESTIMATE' && !t.convertedTo ? '<button class="btn tiny primary" onclick="convertEstimate(\'' + t.id + '\')">To Sale</button> ' : '') +
      ((t.lines || []).length ? '<button class="btn tiny ghost" onclick="printTxn(\'' + t.id + '\')">Print</button> ' : '') +
      '<button class="btn tiny ghost" onclick="openTxnForm(\'' + t.type + '\',\'' + t.id + '\')">Edit</button> ' +
      '<button class="btn tiny danger-ghost" onclick="askDeleteTxn(\'' + t.id + '\')">Delete</button></td></tr>';
  }).join('');
  if (!rows) rows = '<tr><td colspan="7" class="empty">No transactions yet.</td></tr>';

  el('view').innerHTML =
    '<div class="page-head"><h2>' + def.title + '</h2><div class="head-actions">' +
    '<input class="search" placeholder="Search number or party…" value="' + esc(window._txnSearch || '') + '" oninput="_txnSearch=this.value;renderTxnList(\'' + defKey + '\')">' +
    def.add.map(a => '<button class="btn primary" onclick="openTxnForm(\'' + a[0] + '\')">' + a[1] + '</button>').join('') +
    '</div></div>' +
    '<div class="cards">' +
    '<div class="card stat"><div class="stat-label">Total Amount</div><div class="stat-value">' + fmtMoney(totalAmt) + '</div></div>' +
    (defKey === 'sales' || defKey === 'purchases' ? '<div class="card stat"><div class="stat-label">Balance Due</div><div class="stat-value ' + (totalDue ? 'neg' : '') + '">' + fmtMoney(totalDue) + '</div></div>' : '') +
    '</div>' +
    '<div class="card"><div class="table-wrap"><table><thead><tr><th>Date</th><th>Number</th><th>Party / Category</th><th class="r">Total</th><th class="r">Balance</th><th>Status</th><th class="r">Actions</th></tr></thead><tbody>' +
    rows + '</tbody></table></div></div>';
}

function askDeleteTxn(id) {
  confirmDialog('Delete this transaction? Stock and balances will be recalculated.', () => {
    deleteTxn(id);
    toast('Transaction deleted');
    route();
  });
}

/* =========================================================
   Transaction form
   ========================================================= */
let draft = null;

function isItemType(type) {
  return ['SALE', 'PURCHASE', 'SALE_RETURN', 'PURCHASE_RETURN', 'ESTIMATE'].includes(type);
}

function partyOptionsFor(type, selectedId) {
  const kind = TXN_TYPES[type].party;
  const list = state.parties.filter(p => p.type === kind || p.type === 'both')
    .sort((a, b) => a.name.localeCompare(b.name));
  let opts = '<option value="">— ' + (type === 'SALE' || type === 'ESTIMATE' ? 'Cash Sale (no party)' : 'Select party') + ' —</option>';
  for (const p of list) {
    opts += '<option value="' + p.id + '"' + (p.id === selectedId ? ' selected' : '') + '>' + esc(p.name) + '</option>';
  }
  return opts;
}

function openTxnForm(type, id, presetPartyId) {
  const existing = id ? getTxn(id) : null;
  draft = existing ? JSON.parse(JSON.stringify(existing)) : {
    id: null, type: type, number: nextNumber(type), date: todayStr(),
    partyId: presetPartyId || '', lines: [], discountPct: 0, paid: 0,
    mode: 'Cash', category: EXPENSE_CATEGORIES[0], notes: '', total: 0
  };
  if (isItemType(type) && draft.lines.length === 0) draft.lines.push(blankLine());

  const cfg = TXN_TYPES[type];
  let body;
  if (isItemType(type)) {
    body =
      '<div class="form-grid form-grid-4">' +
      '<label>Party<select id="tf_party" onchange="draft.partyId=this.value">' + partyOptionsFor(type, draft.partyId) + '</select></label>' +
      '<label>Number<input id="tf_number" value="' + esc(draft.number) + '"></label>' +
      '<label>Date<input id="tf_date" type="date" value="' + esc(draft.date) + '"></label>' +
      '<label>Payment Mode<select id="tf_mode">' + PAY_MODES.map(m => '<option' + (draft.mode === m ? ' selected' : '') + '>' + m + '</option>').join('') + '</select></label>' +
      '</div>' +
      '<div class="table-wrap"><table class="lines-table"><thead><tr>' +
      '<th style="width:30%">Item</th><th class="r">Qty</th><th>Unit</th><th class="r">Rate (₹)</th><th class="r">Disc %</th><th class="r">GST %</th><th class="r">Amount</th><th></th>' +
      '</tr></thead><tbody id="tf_lines"></tbody></table></div>' +
      '<button class="btn ghost" onclick="draft.lines.push(blankLine());renderLines()">+ Add Row</button>' +
      '<div class="totals-panel" id="tf_totals"></div>' +
      '<label class="notes">Notes<textarea id="tf_notes" rows="2" oninput="draft.notes=this.value">' + esc(draft.notes || '') + '</textarea></label>';
  } else if (type === 'EXPENSE') {
    body =
      '<div class="form-grid">' +
      '<label>Category<select id="tf_cat">' + EXPENSE_CATEGORIES.map(c => '<option' + (draft.category === c ? ' selected' : '') + '>' + c + '</option>').join('') + '</select></label>' +
      '<label>Amount (₹) *<input id="tf_amount" type="number" step="0.01" min="0" value="' + (num(draft.total) || '') + '"></label>' +
      '<label>Date<input id="tf_date" type="date" value="' + esc(draft.date) + '"></label>' +
      '<label>Payment Mode<select id="tf_mode">' + PAY_MODES.filter(m => m !== 'Credit').map(m => '<option' + (draft.mode === m ? ' selected' : '') + '>' + m + '</option>').join('') + '</select></label>' +
      '<label>Number<input id="tf_number" value="' + esc(draft.number) + '"></label>' +
      '<label class="span2">Notes<textarea id="tf_notes" rows="2">' + esc(draft.notes || '') + '</textarea></label></div>';
  } else { // PAYMENT_IN / PAYMENT_OUT
    body =
      '<div class="form-grid">' +
      '<label>Party *<select id="tf_party">' + partyOptionsFor(type, draft.partyId) + '</select></label>' +
      '<label>Amount (₹) *<input id="tf_amount" type="number" step="0.01" min="0" value="' + (num(draft.total) || '') + '"></label>' +
      '<label>Date<input id="tf_date" type="date" value="' + esc(draft.date) + '"></label>' +
      '<label>Payment Mode<select id="tf_mode">' + PAY_MODES.filter(m => m !== 'Credit').map(m => '<option' + (draft.mode === m ? ' selected' : '') + '>' + m + '</option>').join('') + '</select></label>' +
      '<label>Receipt Number<input id="tf_number" value="' + esc(draft.number) + '"></label>' +
      '<label class="span2">Notes<textarea id="tf_notes" rows="2">' + esc(draft.notes || '') + '</textarea></label></div>' +
      '<p class="sub" id="tf_partybal"></p>';
  }

  openModal(
    '<div class="modal-head"><h3>' + (existing ? 'Edit ' : 'New ') + cfg.label + '</h3><button class="x" onclick="closeModal()">×</button></div>' +
    '<div class="modal-body">' + body + '</div>' +
    '<div class="modal-foot"><button class="btn ghost" onclick="closeModal()">Cancel</button>' +
    '<button class="btn primary" onclick="saveTxn()">' + (existing ? 'Save Changes' : 'Save ' + cfg.label) + '</button></div>',
    isItemType(type)
  );

  if (isItemType(type)) { renderLines(); }
  if (type === 'PAYMENT_IN' || type === 'PAYMENT_OUT') {
    const sel = el('tf_party');
    const updBal = () => {
      const b = sel.value ? partyBalance(sel.value) : 0;
      el('tf_partybal').textContent = sel.value ? 'Current balance: ' + fmtMoney(Math.abs(b)) + (b >= 0 ? ' to receive' : ' to pay') : '';
    };
    sel.addEventListener('change', updBal);
    updBal();
  }
}

function blankLine() {
  return { itemId: '', name: '', hsn: '', unit: 'PCS', qty: 1, rate: 0, disc: 0, taxRate: 0 };
}

function itemOptions(selectedId) {
  let o = '<option value="">— select item —</option>';
  for (const it of state.items.slice().sort((a, b) => a.name.localeCompare(b.name))) {
    o += '<option value="' + it.id + '"' + (it.id === selectedId ? ' selected' : '') + '>' + esc(it.name) + '</option>';
  }
  return o;
}

function renderLines() {
  const tb = el('tf_lines');
  if (!tb) return;
  tb.innerHTML = draft.lines.map((l, i) => {
    const gross = num(l.qty) * num(l.rate);
    const amt = gross - gross * num(l.disc) / 100;
    return '<tr>' +
      '<td><select onchange="lineItemPick(' + i + ',this.value)">' + itemOptions(l.itemId) + '</select></td>' +
      '<td><input class="r" type="number" step="any" min="0" value="' + num(l.qty) + '" oninput="lineSet(' + i + ',\'qty\',this.value)"></td>' +
      '<td><input value="' + esc(l.unit) + '" oninput="lineSet(' + i + ',\'unit\',this.value)"></td>' +
      '<td><input class="r" type="number" step="0.01" min="0" value="' + num(l.rate) + '" oninput="lineSet(' + i + ',\'rate\',this.value)"></td>' +
      '<td><input class="r" type="number" step="0.01" min="0" max="100" value="' + num(l.disc) + '" oninput="lineSet(' + i + ',\'disc\',this.value)"></td>' +
      '<td><select onchange="lineSet(' + i + ',\'taxRate\',this.value)">' + GST_RATES.map(r => '<option value="' + r + '"' + (num(l.taxRate) === r ? ' selected' : '') + '>' + r + '%</option>').join('') + '</select></td>' +
      '<td class="r amt">' + fmtMoney(amt) + '</td>' +
      '<td><button class="btn tiny danger-ghost" onclick="draft.lines.splice(' + i + ',1);if(!draft.lines.length)draft.lines.push(blankLine());renderLines()">×</button></td></tr>';
  }).join('');
  renderTotals();
}

function lineItemPick(i, itemId) {
  const l = draft.lines[i];
  l.itemId = itemId;
  const it = getItem(itemId);
  if (it) {
    l.name = it.name; l.hsn = it.hsn; l.unit = it.unit;
    l.rate = ['PURCHASE', 'PURCHASE_RETURN'].includes(draft.type) ? num(it.purchasePrice) || num(it.salePrice) : num(it.salePrice);
    l.taxRate = state.settings.taxEnabled ? num(it.taxRate) : 0;
  }
  renderLines();
}

function lineSet(i, field, value) {
  draft.lines[i][field] = field === 'unit' ? value : num(value);
  // update only totals + this row's amount to preserve input focus
  const row = el('tf_lines').rows[i];
  if (row) {
    const l = draft.lines[i];
    const gross = num(l.qty) * num(l.rate);
    row.querySelector('.amt').textContent = fmtMoney(gross - gross * num(l.disc) / 100);
  }
  txnTotalsRecalc();
}

/* Panel is built once; typing only updates the number displays (see billing.js
   for why — rebuilding inputs on their own oninput steals focus mid-keystroke). */
function renderTotals() {
  const box = el('tf_totals');
  if (!box) return;
  const paidLabel = ['SALE', 'ESTIMATE'].includes(draft.type) ? 'Received' : draft.type === 'SALE_RETURN' ? 'Refunded' : 'Paid';
  box.innerHTML =
    '<div class="totals-row"><span>Subtotal (taxable)</span><span id="tf_sub"></span></div>' +
    '<div class="totals-row"><span>Discount <input id="tf_disc" type="number" min="0" max="100" step="0.01" style="width:70px" onfocus="this.select()" value="' + num(draft.discountPct) + '" oninput="draft.discountPct=num(this.value);txnTotalsRecalc()"> %</span><span id="tf_discamt"></span></div>' +
    (state.settings.taxEnabled ? '<div class="totals-row"><span>GST</span><span id="tf_gst"></span></div>' : '') +
    '<div class="totals-row"><span>Round Off</span><span id="tf_ro"></span></div>' +
    '<div class="totals-row grand"><span>Total</span><span id="tf_grand"></span></div>' +
    (draft.type !== 'ESTIMATE' ?
      '<div class="totals-row"><span>' + paidLabel + ' <button class="btn tiny ghost" onclick="draftPaidFull()">Full</button></span>' +
      '<span><input id="tf_paid" type="number" min="0" step="0.01" style="width:110px;text-align:right" onfocus="this.select()" value="' + num(draft.paid) + '" oninput="draft.paid=num(this.value);txnTotalsRecalc()"></span></div>' +
      '<div class="totals-row due"><span>Balance Due</span><span id="tf_due"></span></div>' : '');
  txnTotalsRecalc();
}

function txnTotalsRecalc() {
  const lines = draft.lines.filter(l => l.itemId || num(l.qty) * num(l.rate) > 0);
  const t = computeTotals(JSON.parse(JSON.stringify(lines)), draft.discountPct, state.settings.taxEnabled);
  draft._totals = t;
  el('tf_sub').textContent = fmtMoney(t.subtotal);
  el('tf_discamt').textContent = '− ' + fmtMoney(t.discount);
  if (el('tf_gst')) el('tf_gst').textContent = '+ ' + fmtMoney(t.taxAmount);
  el('tf_ro').textContent = fmtMoney(t.roundOff);
  el('tf_grand').textContent = fmtMoney(t.total);
  if (el('tf_due')) el('tf_due').textContent = fmtMoney(Math.max(0, t.total - num(draft.paid)));
}

function draftPaidFull() {
  draft.paid = draft._totals ? draft._totals.total : 0;
  const inp = el('tf_paid');
  if (inp) inp.value = draft.paid;
  txnTotalsRecalc();
}

function saveTxn() {
  const type = draft.type;
  draft.number = el('tf_number') ? el('tf_number').value.trim() || draft.number : draft.number;
  draft.date = el('tf_date') ? (el('tf_date').value || todayStr()) : draft.date;
  draft.mode = el('tf_mode') ? el('tf_mode').value : draft.mode;
  draft.notes = el('tf_notes') ? el('tf_notes').value.trim() : draft.notes;

  if (isItemType(type)) {
    draft.partyId = el('tf_party').value || null;
    draft.lines = draft.lines.filter(l => l.itemId && num(l.qty) > 0);
    if (draft.lines.length === 0) { toast('Add at least one item line', 'error'); return; }
    // fill denormalized names
    for (const l of draft.lines) {
      const it = getItem(l.itemId);
      if (it) {
        l.name = it.name; l.hsn = it.hsn;
        if (l.cost == null) l.cost = num(it.purchasePrice);
      }
    }
    const t = computeTotals(draft.lines, draft.discountPct, state.settings.taxEnabled);
    Object.assign(draft, t);
    if (type === 'ESTIMATE') draft.paid = 0;
    if (num(draft.paid) > t.total) draft.paid = t.total;
  } else {
    const amount = num(el('tf_amount').value);
    if (amount <= 0) { toast('Enter an amount', 'error'); return; }
    draft.total = amount;
    draft.paid = amount;
    draft.lines = [];
    draft.subtotal = amount; draft.discount = 0; draft.taxAmount = 0; draft.roundOff = 0;
    if (type === 'EXPENSE') {
      draft.category = el('tf_cat').value;
      draft.partyId = null;
    } else {
      draft.partyId = el('tf_party').value || null;
      if (!draft.partyId) { toast('Select a party for the payment', 'error'); return; }
    }
  }
  delete draft._totals;

  if (draft.id) {
    const idx = state.txns.findIndex(t => t.id === draft.id);
    if (idx >= 0) state.txns[idx] = draft;
  } else {
    draft.id = uid();
    draft.createdAt = Date.now();
    state.txns.push(draft);
    bumpCounter(type);
  }
  save();
  closeModal();
  toast(TXN_TYPES[type].label + ' saved');
  const savedId = draft.id;
  route();
  if (isItemType(type) && type !== 'ESTIMATE') {
    // offer print right away
    setTimeout(() => { if (getTxn(savedId)) viewTxn(savedId); }, 60);
  }
}

function convertEstimate(id) {
  const est = getTxn(id);
  if (!est || est.convertedTo) return;
  const sale = JSON.parse(JSON.stringify(est));
  sale.id = uid();
  sale.type = 'SALE';
  sale.number = nextNumber('SALE');
  sale.date = todayStr();
  sale.paid = 0;
  sale.createdAt = Date.now();
  delete sale.convertedTo;
  state.txns.push(sale);
  bumpCounter('SALE');
  est.convertedTo = sale.id;
  save();
  toast('Estimate converted to Sale ' + sale.number);
  route();
}

/* =========================================================
   Transaction detail + print

        '</td><td class="r">' + fmtQty(l.qty) + ' ' + esc(l.unit) + '</td><td class="r">' + fmtMoney(l.rate) + '</td><td class="r">' + num(l.taxRate) + '%</td><td class="r">' + fmtMoney(num(l.amount) + num(l.tax)) + '</td></tr>').join('') +
      '</tbody></table></div>' +

      (num(t.taxAmount) ? '<div class="totals-row"><span>GST</span><span>+ ' + fmtMoney(t.taxAmount) + '</span></div>' : '') +
      '<div class="totals-row grand"><span>Total</span><span>' + fmtMoney(t.total) + '</span></div>' +
      '<div class="totals-row"><span>Paid / Received</span><span>' + fmtMoney(t.paid) + '</span></div>' +
      '<div class="totals-row due"><span>Balance</span><span>' + fmtMoney(Math.max(0, num(t.total) - num(t.paid))) + '</span></div></div>';
  } else {
    linesHtml = '<p class="stat-value">' + fmtMoney(t.total) + '</p><p class="sub">' + esc(t.mode || '') + (t.category ? ' · ' + esc(t.category) : '') + '</p>';
  }

    '<div class="modal-head"><h3>' + cfg.label + ' ' + esc(t.number) + ' <span class="badge ' + (st === 'Paid' || st === 'Converted' ? 'ok' : st === 'Partial' ? 'warn' : 'bad') + '">' + st + '</span></h3><button class="x" onclick="closeModal()">×</button></div>' +
    '<div class="modal-body">' +
    '<p><strong>' + esc(t.type === 'EXPENSE' ? (t.category || 'Expense') : partyName(t.partyId)) + '</strong> · ' + fmtDate(t.date) + (t.mode ? ' · ' + esc(t.mode) : '') +
    (t.referredBy ? ' · Referred by ' + esc(t.referredBy) : '') + '</p>' +
    linesHtml +
    (t.notes ? '<p class="sub">Note: ' + esc(t.notes) + '</p>' : '') +
    '</div>' +
    '<div class="modal-foot">' +
    ((t.lines || []).length ? '<button class="btn wa" onclick="waShareTxn(\'' + t.id + '\')">🟢 WhatsApp</button>' +
      '<button class="btn ghost" onclick="printTxn(\'' + t.id + '\')">🖨 Print / PDF</button>' : '') +
    '<button class="btn ghost" onclick="closeModal();openTxnForm(\'' + t.type + '\',\'' + t.id + '\')">Edit</button>' +
    '<button class="btn primary" onclick="closeModal()">Done</button></div>',
    true
  );
}

/* Share a bill summary via WhatsApp. Uses the wa.me deep link — opens
   WhatsApp app on phones and WhatsApp Web on desktop. If the party has a
   phone number the chat is pre-selected, otherwise WhatsApp asks to pick. */
function waShareTxn(id) {
  const t = getTxn(id);
  if (!t) return;
  const s = state.settings;
  const p = t.partyId ? getParty(t.partyId) : null;
  let msg = '*' + s.businessName + '*\n';
  msg += (t.type === 'ESTIMATE' ? 'Estimate' : 'Bill') + ' *' + t.number + '* | ' + fmtDate(t.date) + '\n';
  if (p) msg += 'To: ' + p.name + '\n';
  msg += '------------------------\n';
  for (const l of (t.lines || [])) {
    msg += '• ' + l.name + (l.brand ? ' (' + l.brand + ')' : '') + '  x' + fmtQty(l.qty) +
      ' = ₹' + fmtMoney(num(l.amount) + num(l.tax), false) + '\n';
  }
  msg += '------------------------\n';
  if (num(t.discount)) msg += 'Discount: -₹' + fmtMoney(t.discount, false) + '\n';
  if (num(t.taxAmount)) msg += 'GST: ₹' + fmtMoney(t.taxAmount, false) + '\n';
  msg += '*Total: ₹' + fmtMoney(t.total, false) + '*\n';
  if (t.type !== 'ESTIMATE') {
    msg += 'Received: ₹' + fmtMoney(t.paid, false) + '\n';
    const due = Math.max(0, num(t.total) - num(t.paid));
    if (due > 0) msg += '*Balance Due: ₹' + fmtMoney(due, false) + '*\n';
  }
  if (s.upiId) msg += 'Pay via UPI: ' + s.upiId + '\n';
  msg += 'Thank you! 🙏';
  let phone = p && p.phone ? p.phone.replace(/\D/g, '') : '';
  if (phone.length === 10) phone = '91' + phone; // default Indian country code
  const url = 'https://wa.me/' + phone + '?text=' + encodeURIComponent(msg);
  const w = window.open(url, '_blank');
  if (!w) toast('Pop-up blocked — allow pop-ups to share on WhatsApp', 'error');
}

function printTxn(id) {
  const t = getTxn(id);
  if (!t) return;
  const s = state.settings;
  const p = t.partyId ? getParty(t.partyId) : null;
  const split = taxSplitFor(t);
  const docTitle = t.type === 'SALE' ? 'TAX INVOICE' : t.type === 'ESTIMATE' ? 'ESTIMATE / QUOTATION' : TXN_TYPES[t.type].label.toUpperCase();

  let rows = t.lines.map((l, i) => {
    const taxHalf = num(l.tax) / 2;
    const meta = [l.brand, l.description].filter(Boolean).join(' — ');
    return '<tr><td>' + (i + 1) + '</td><td>' + esc(l.name) +
      (meta ? '<br><span class="muted" style="font-size:11px">' + esc(meta) + '</span>' : '') +
      '</td><td>' + esc(l.hsn || '') + '</td>' +
      '<td class="r">' + fmtQty(l.qty) + ' ' + esc(l.unit) + '</td><td class="r">' + fmtMoney(l.rate, false) + '</td>' +
      '<td class="r">' + fmtMoney(l.amount, false) + '</td>' +
      (s.taxEnabled ?
        (split === 'IGST'
          ? '<td class="r">' + num(l.taxRate) + '%<br>' + fmtMoney(l.tax, false) + '</td>'
          : '<td class="r">' + (num(l.taxRate) / 2) + '%<br>' + fmtMoney(taxHalf, false) + '</td><td class="r">' + (num(l.taxRate) / 2) + '%<br>' + fmtMoney(taxHalf, false) + '</td>')
        : '') +
      '<td class="r">' + fmtMoney(num(l.amount) + num(l.tax), false) + '</td></tr>';
  }).join('');

  const taxCols = s.taxEnabled ? (split === 'IGST' ? '<th class="r">IGST</th>' : '<th class="r">CGST</th><th class="r">SGST</th>') : '';

/* VyaparOpen — import.js : bulk import Items & Parties from Excel (.xlsx) or CSV */
'use strict';

/* ---------- CSV parsing (handles quotes, commas, CRLF, embedded newlines) ---------- */
function parseCSV(text) {
  const rows = [];
  let row = [], field = '', inQ = false;
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1); // strip BOM
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else inQ = false;
      } else field += c;
    } else if (c === '"') inQ = true;
    else if (c === ',') { row.push(field); field = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(field); field = '';
      rows.push(row); row = [];
    } else field += c;
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim() !== ''));
}

/* ---------- minimal XLSX reader (first worksheet) ----------
   A .xlsx is a ZIP of XML files. We parse the ZIP central directory,
   inflate entries with the browser's DecompressionStream, and read
   xl/worksheets/sheetN.xml + xl/sharedStrings.xml. No libraries. */
async function readXlsxRows(arrayBuffer) {
  const bytes = new Uint8Array(arrayBuffer);
  const view = new DataView(arrayBuffer);

  // find End Of Central Directory record (scan back for signature 0x06054b50)
  let eocd = -1;
  for (let i = bytes.length - 22; i >= Math.max(0, bytes.length - 22 - 65535); i--) {
    if (view.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('Not a valid .xlsx file (ZIP directory not found)');
  const count = view.getUint16(eocd + 10, true);
  let off = view.getUint32(eocd + 16, true);

  const entries = {};
  const dec = new TextDecoder();
  for (let n = 0; n < count; n++) {
    if (view.getUint32(off, true) !== 0x02014b50) break;
    const method = view.getUint16(off + 10, true);
    const csize = view.getUint32(off + 20, true);
    const nameLen = view.getUint16(off + 28, true);
    const extraLen = view.getUint16(off + 30, true);
    const commentLen = view.getUint16(off + 32, true);
    const localOff = view.getUint32(off + 42, true);
    const name = dec.decode(bytes.subarray(off + 46, off + 46 + nameLen));
    entries[name] = { method, csize, localOff };
    off += 46 + nameLen + extraLen + commentLen;
  }

  async function extract(name) {
    const e = entries[name];
    if (!e) return null;
    const nLen = view.getUint16(e.localOff + 26, true);
    const xLen = view.getUint16(e.localOff + 28, true);
    const start = e.localOff + 30 + nLen + xLen;
    const data = bytes.subarray(start, start + e.csize);
    if (e.method === 0) return dec.decode(data);
    if (e.method === 8) {
      const ds = new DecompressionStream('deflate-raw');
      const stream = new Blob([data]).stream().pipeThrough(ds);
      return await new Response(stream).text();
    }
    throw new Error('Unsupported compression in .xlsx');
  }

  // first worksheet (lowest sheet number)
  const sheetName = Object.keys(entries)
    .filter(n => /^xl\/worksheets\/sheet\d+\.xml$/.test(n))
    .sort((a, b) => parseInt(a.match(/\d+/)[0]) - parseInt(b.match(/\d+/)[0]))[0];
  if (!sheetName) throw new Error('No worksheet found in the Excel file');

  const sheetXml = await extract(sheetName);
  const sharedXml = await extract('xl/sharedStrings.xml');

  const parser = new DOMParser();
  const shared = [];
  if (sharedXml) {
    const sdoc = parser.parseFromString(sharedXml, 'application/xml');
    sdoc.querySelectorAll('si').forEach(si => {
      let s = '';
      si.querySelectorAll('t').forEach(t => { s += t.textContent; });
      shared.push(s);
    });
  }

  const doc = parser.parseFromString(sheetXml, 'application/xml');
  const rows = [];
  doc.querySelectorAll('row').forEach(rEl => {
    const cells = [];
    rEl.querySelectorAll('c').forEach(cEl => {
      const ref = cEl.getAttribute('r') || '';
      const colLetters = ref.replace(/\d+/g, '');
      let col = 0;
      for (const ch of colLetters) col = col * 26 + (ch.charCodeAt(0) - 64);
      col = Math.max(1, col) - 1;
      const t = cEl.getAttribute('t');
      let val = '';
      if (t === 'inlineStr') {
        val = cEl.textContent;
      } else {
        const v = cEl.querySelector('v');
        val = v ? v.textContent : '';
        if (t === 's') val = shared[parseInt(val)] != null ? shared[parseInt(val)] : '';
        if (t === 'b') val = val === '1' ? 'TRUE' : 'FALSE';
      }
      cells[col] = val;
    });
    for (let i = 0; i < cells.length; i++) if (cells[i] === undefined) cells[i] = '';
    if (cells.some(c => String(c).trim() !== '')) rows.push(cells);
  });
  return rows;
}

/* ---------- column definitions & header matching ---------- */
const IMPORT_DEFS = {
  items: {

      { key: 'description', label: 'Description', match: ['description', 'desc', 'productdescription', 'itemdescription', 'details'] },

    ],

      ['Basmati Rice 5kg', 'Grocery', 'India Gate', 'BAG', '1006', 'Premium aged basmati', '550', '470', '5', '40', '10', 'product'],
      ['Home Delivery', 'Services', '', 'SERVICE', '9965', 'Delivery within city limits', '50', '0', '18', '', '', 'service']]
  },

    template: 'parties-import-template.csv',
    columns: [
      { key: 'name', label: 'Party Name', required: true, match: ['name', 'partyname', 'party', 'customername', 'customer', 'suppliername', 'businessname'] },
      { key: 'phone', label: 'Phone', match: ['phone', 'mobile', 'phonenumber', 'mobilenumber', 'contact', 'contactno'] },
      { key: 'email', label: 'Email', match: ['email', 'emailid', 'mail'] },
      { key: 'gstin', label: 'GSTIN', match: ['gstin', 'gst', 'gstno', 'gstnumber', 'gstinno'] },
      { key: 'type', label: 'Type', match: ['type', 'partytype'] },
      { key: 'address', label: 'Address', match: ['address', 'billingaddress', 'city', 'location'] },
