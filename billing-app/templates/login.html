{% extends "base.html" %}
{% block title %}Login — Shop Billing{% endblock %}
{% block content %}
<div class="login-box card">
  <h1>🧾 Shop Billing</h1>
  <p class="muted">Sign in to continue</p>
  {% if error %}<p class="msg">{{ error }}</p>{% endif %}
  <form method="post">
    <label>Username <input name="username" autofocus autocomplete="username"></label>
    <label>Password <input name="password" type="password" autocomplete="current-password"></label>
    <button class="btn wide" type="submit">Login</button>
  </form>
  <p class="muted small">First time? Use <strong>admin / admin123</strong>, then change it from the Users page.</p>
</div>
{% endblock %}
