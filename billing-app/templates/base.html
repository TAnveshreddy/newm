<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Shop Billing{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
{% if session.get('user') %}
<nav class="topnav no-print">
  <span class="brand">🧾 Shop Billing</span>
  <a href="{{ url_for('dashboard') }}" class="{{ 'active' if request.endpoint == 'dashboard' }}">Dashboard</a>
  <a href="{{ url_for('new_bill') }}" class="{{ 'active' if request.endpoint == 'new_bill' }}">New Bill</a>
  <a href="{{ url_for('bills') }}" class="{{ 'active' if request.endpoint == 'bills' }}">Bills</a>
  <a href="{{ url_for('customers') }}" class="{{ 'active' if request.endpoint == 'customers' }}">Customers</a>
  <a href="{{ url_for('products') }}" class="{{ 'active' if request.endpoint == 'products' }}">Products</a>
  <a href="{{ url_for('inventory') }}" class="{{ 'active' if request.endpoint == 'inventory' }}">Inventory</a>
  <a href="{{ url_for('reports') }}" class="{{ 'active' if request.endpoint == 'reports' }}">Reports</a>
  {% if session.get('role') == 'admin' %}
  <a href="{{ url_for('users') }}" class="{{ 'active' if request.endpoint == 'users' }}">Users</a>
  <a href="{{ url_for('backup') }}" class="{{ 'active' if request.endpoint == 'backup' }}">Backup</a>
  {% endif %}
  <span class="spacer"></span>
  <span class="who">👤 {{ session['user'] }}</span>
  <a href="{{ url_for('logout') }}">Logout</a>
</nav>
{% endif %}
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
